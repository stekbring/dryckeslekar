<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuck the Dealer</title>
  <script>
    /* =====================================================================
       VERSION – höj denna när du byter ut en BILD i den här leken
       (t.ex. "1" till "2"). Då hämtar alla besökare den nya bilden direkt
       i stället för den gamla som ligger sparad i deras webbläsare.
       Text i den här filen och i .txt-filer syns alltid direkt ändå.
       ===================================================================== */
    var VERSION = "1";

    function v(url) { return url + "?v=" + VERSION; }
    (function () {
      var bakgrund = "webb/background.webp";
      var forst = ["webb/rubrik.webp"];
      if (bakgrund) {
        document.documentElement.style.setProperty("--bg", 'url("' + v(bakgrund) + '")');
        forst.unshift(bakgrund);
      }
      forst.forEach(function (h) {
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "image"; l.href = v(h);
        document.head.appendChild(l);
      });
    })();
    /* Textfilen börjar hämtas direkt (alltid senaste versionen från servern) */
    var textLaddas = fetch("instruktioner.txt", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); });
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E6WCG90MQZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-E6WCG90MQZ');
  </script>
  <link rel="icon" type="image/x-icon" href="/bilder/dryckeslekarlogga.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'Times New Roman', serif;
      color: #fff;
      padding: 10px;
    }

    html { background-color: #111; }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      z-index: -1;
      background-color: #111;
      background-image: var(--bg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .header-image {
      display: block;
      max-width: 100%;
      height: auto;
      margin-top: 40px;
      margin-bottom: 50px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 10px;
    }

    body {
      padding: 60px 10px 10px 10px;
    }

    .rules-list {
      background: rgba(0, 0, 0, 0);
      padding: 20px;
      border-radius: 15px;
      max-width: 800px;
      margin: 0 auto;
      text-align: left;
    }

    .big-text {
      font-size: 1.2em;
      font-weight: bold;
      text-align: center;
      display: block;
      margin: 20px 0;
    }

    h2, h3 {
      margin-top: 20px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="background"></div>

<img data-src="webb/rubrik.webp" alt="Fuck the Dealer" class="header-image" width="1337" height="245" fetchpriority="high">

<div class="rules-list" id="rules"></div>

<script>
  /* Bildadresser med versionsnummer */
  (function () {
    var bilder = document.querySelectorAll("img[data-src]");
    for (var i = 0; i < bilder.length; i++) bilder[i].src = v(bilder[i].getAttribute("data-src"));
  })();

  /* Visar regeltexten. Format: # rubrik, ## underrubrik, **fet**, *kursiv*, __stor text__, -- = radbrytning */
  textLaddas.then(function (data) {
    var lista = document.getElementById("rules");
    data.split("\n").forEach(function (line) {
      if (line.trim() === "") return;
      var formatted = line
        .replace(/^# (.*)/, "<h2>$1</h2>")
        .replace(/^## (.*)/, "<h3>$1</h3>")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.*?)\*/g, "<em>$1</em>")
        .replace(/__(.*?)__/g, '<span class="big-text">$1</span>')
        .replace(/--/g, "<br><br>");
      var rad = document.createElement("div");
      rad.innerHTML = formatted;
      lista.appendChild(rad);
    });
  }).catch(function (fel) {
    console.error("Kunde inte läsa regelfilen:", fel);
  });

  /* Sparar sidans bilder i webbläsaren så nästa besök går snabbare (se /sw.js) */
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
      function forladda() {
        var sw = navigator.serviceWorker.controller;
        if (!sw) return;
        var urls = ["webb/background.webp"].map(v);
        document.querySelectorAll("img[data-src]").forEach(function (b) { urls.push(v(b.getAttribute("data-src"))); });
        sw.postMessage({ typ: "forladda", urls: urls.map(function (u) { return new URL(u, location.href).href; }) });
      }
      navigator.serviceWorker.addEventListener("controllerchange", forladda);
      setTimeout(forladda, 1500);
    });
  }
</script>
</body>
</html>
