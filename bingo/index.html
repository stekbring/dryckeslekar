<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>ÖlBingo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .latest-number {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 5em;
      color: #ffd700;
      text-shadow: 2px 2px 8px #000, 0 0 20px #ffd700;
      z-index: 10;
      font-weight: bold;
      pointer-events: none;
      user-select: none;
      letter-spacing: 0.1em;
      min-width: 1.5em;
      text-align: center;
      display: none;
    }
    html::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: #111 url('bingobakgrund.png') no-repeat center center;
      background-size: cover;
      z-index: -1;
    }

    body {
      margin: 0;
      padding: 100px 10px 10px 10px;
      font-family: Arial, sans-serif;
      background: transparent;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
    }

    .hidden {
      display: none;
    }

    .btn {
      padding: 15px 30px;
      margin: 10px 0;
      font-size: 1.2em;
      border: none;
      border-radius: 8px;
      background: #03587a;
      color: white;
      cursor: pointer;
      display: block;
    }

    .section {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .drawn-numbers {
      margin-top: 20px;
      max-width: 300px;
      word-wrap: break-word;
      text-align: center;
      background: rgba(0, 0, 0, 0.6);

    }

    .bingo-board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 2px;
      margin-top: 20px;
    }

    .bingo-cell {
      width: 35px;
      height: 35px;
      background: #333;
      border: 1px solid #555;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      position: relative;
      font-size: 0.9em;
      user-select: none;
    }

    .bingo-cell.marked::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      background-image: url('markering.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 1;
      pointer-events: none;
      z-index: 0;
    }

    .bingo-cell span {
      position: relative;
      z-index: 1;
    }

    .toggle-container {
      margin-top: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .back-btn {
      margin-top: 40px;
      font-size: 0.9em;
      padding: 8px 16px;
      background: #444;
    }

    .logo {
      max-width: 300px;
      margin-bottom: 40px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    #start-screen button {
      margin: 10px 0;
    }
  </style>
</head>
<body>

<!-- START SCREEN -->
<div id="start-screen">
  <img src="rubrik.png" alt="ÖlBingo" class="logo">
  <div style="text-align: center; display: flex; flex-direction: column; align-items: center; margin-top: 30px;">
    <button class="btn" onclick="showSection('host')">Speaker</button>
    <button class="btn" onclick="showSection('player')">Player</button>
  </div>
</div>

<!-- HOST VIEW -->
<div id="latest-number" class="latest-number"></div>
<div id="host" class="section">
  <button class="btn" onclick="drawNumber()">Nytt nummer</button>
  <button class="btn" onclick="resetNumbers()">Ny bricka</button>
  <div class="toggle-container">
    <label for="autoSpeak">Automatisk uppläsning</label>
    <input type="checkbox" id="autoSpeak">
  </div>
  <div>
    <label>Spelform:</label>
    <select id="mode">
      <option>En rad</option>
      <option>Två rader</option>
      <option>Hel bricka</option>
    </select>
  </div>
  <div class="drawn-numbers" id="drawn"></div>
  <button class="btn back-btn" onclick="goBack()">Tillbaka</button>
</div>

<!-- PLAYER VIEW -->
<div id="player" class="section">
  <h2>Spelarvy</h2>
  <div id="bingo-container"></div>
  <button class="btn" onclick="bingoSound()">BINGO!</button>
  <button class="btn back-btn" onclick="goBack()">Tillbaka</button>
</div>

<script>
  const spokenNumbers = [];

  function showSection(id) {
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("host").style.display = "none";
    document.getElementById("player").style.display = "none";
    document.getElementById(id).style.display = "flex";
    if (id === 'player') generateBingoCard();
  }

  function goBack() {
    resetNumbers();
    document.getElementById("host").style.display = "none";
    document.getElementById("player").style.display = "none";
    document.getElementById("start-screen").style.display = "block";
  }

  function drawNumber() {
    let num;
    do {
      num = Math.floor(Math.random() * 89) + 1;
    } while (spokenNumbers.includes(num));
    spokenNumbers.push(num);
    document.getElementById("drawn").innerText = spokenNumbers.join(", ");
    if (document.getElementById("autoSpeak").checked) speakNumber(num);

    const latestDiv = document.getElementById("latest-number");
    latestDiv.textContent = num;
    latestDiv.style.display = "block";
  }

  function speakNumber(n) {
    const utterance = new SpeechSynthesisUtterance(n.toString());
    speechSynthesis.speak(utterance);
  }

  function resetNumbers() {
    spokenNumbers.length = 0;
    document.getElementById("drawn").innerText = "";
    document.getElementById("latest-number").style.display = "none";
  }

  function generateBingoCard() {
  const container = document.getElementById("bingo-container");
  container.innerHTML = "";

  const totalNumbers = Array.from({ length: 89 }, (_, i) => i + 1);
  shuffleArray(totalNumbers);

  const totalCards = 6;
  const numbersPerCard = Math.floor(89 / totalCards);
  const remaining = 89 % totalCards;

  let numberIndex = 0;

  for (let cardNum = 0; cardNum < totalCards; cardNum++) {
    const board = document.createElement("div");
    board.className = "bingo-board";

    const cardNumbers = totalNumbers.slice(
      numberIndex,
      numberIndex + numbersPerCard + (cardNum < remaining ? 1 : 0)
    );
    numberIndex += cardNumbers.length;

    // Skapa rutnät
    const cardGrid = Array.from({ length: 3 }, () => Array(9).fill(null));

    // Dela upp siffror i kolumner enligt klassisk bingo-regel
    const colData = Array.from({ length: 9 }, () => []);
    cardNumbers.forEach(num => {
      let col = Math.floor((num - 1) / 10);
      if (num === 90) col = 8; // specialfall om man har 90 med (inte relevant här)
      colData[col].push(num);
    });

    // Fyll rutnätet: fördela siffrorna på 3 rader per kolumn
    for (let col = 0; col < 9; col++) {
      shuffleArray(colData[col]);
      for (let i = 0; i < Math.min(3, colData[col].length); i++) {
        let placed = false;
        for (let row = 0; row < 3; row++) {
          if (!cardGrid[row][col]) {
            cardGrid[row][col] = colData[col][i];
            placed = true;
            break;
          }
        }
        if (!placed) break; // hoppa över om kolumnen är full
      }
    }

    // Skapa HTML för brickan
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 9; col++) {
        const cell = document.createElement("div");
        cell.className = "bingo-cell";
        if (cardGrid[row][col]) {
          const span = document.createElement("span");
          span.textContent = cardGrid[row][col];
          cell.appendChild(span);
        }
        cell.addEventListener("click", () => {
          if (cell.textContent) {
            cell.classList.toggle("marked");
          }
        });
        board.appendChild(cell);
      }
    }

    container.appendChild(board);
  }
}




  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function bingoSound() {
    const audio = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
    audio.play();
  }
</script>

</body>
</html>
