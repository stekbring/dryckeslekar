<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dryckeslekar</title>

  <script>
    /* =====================================================================
       VERSION – ÄNDRA DENNA NÄR DU UPPDATERAR NÅGOT PÅ SIDAN
       (ny bild, ny lek, ändrad text osv). Byt t.ex. "1" till "2".
       Då hämtar alla besökare den nya versionen direkt i stället för
       den gamla som ligger sparad i deras webbläsare.
       ===================================================================== */
    var VERSION = "1";

    /* Lägger till ?v=VERSION på en bildadress så webbläsaren vet att det är en ny version */
    function v(url) { return url + "?v=" + VERSION; }

    /* Bakgrundsbilderna sätts härifrån så att de också får versionsnumret,
       och den som behövs först (dator eller mobil) börjar laddas direkt. */
    (function () {
      var mobil = window.matchMedia("(max-width: 600px)").matches;
      var bakgrund = v(mobil ? "bilder/webb/party3.2.webp" : "bilder/webb/party3.webp");
      var s = document.documentElement.style;
      s.setProperty("--bg-dator", 'url("' + v("bilder/webb/party3.webp") + '")');
      s.setProperty("--bg-mobil", 'url("' + v("bilder/webb/party3.2.webp") + '")');
      s.setProperty("--bg-eld", 'url("' + v("bilder/webb/firepit2.webp") + '")');
      [bakgrund, v("bilder/webb/dryckeslekar.webp")].forEach(function (href) {
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "image"; l.href = href;
        l.setAttribute("fetchpriority", "high");
        document.head.appendChild(l);
      });
    })();
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {

      font-family: 'Times New Roman', cursive, sans-serif;

    .background {

      position: fixed;
      top: 0;
      left: 0;

      height: 100vh;
      z-index: 0;
      background-image: var(--bg-dator);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .hero {
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      position: relative;
      z-index: 1;
      padding-top: 100px;
    }

    .hero-title-img {

      width: 90%;
      max-width: 1500px;
      height: auto;
    }

    .content {
      background-color: #0b1422;
      background-image: var(--bg-eld);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 50px 20px 200px 20px;
      position: relative;
      z-index: 2;
      margin-top: -10px;
      border-top-left-radius: 40px;
      border-top-right-radius: 40px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
      min-height: 100vh;
    }

    .button-grid {
      display: grid;
      gap: 100px;
      max-width: 900px;
      margin: 0 auto;
      padding-top: 40px;
      grid-template-columns: 1fr;
    }

    .button-grid.grid-view {
      grid-template-columns: repeat(2, 1fr) !important;
    }

    .game-button {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      background-color: transparent;
      border: 3px solid #ff4081;
      color: #ff4081;
      padding: 60px 0;
      border-radius: 6px;
      font-size: 1.4em;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      -webkit-tap-highlight-color: transparent;
    }

    .game-button:hover {
      background-color: #ff4081;
      color: white;
      transform: scale(1.05);
    }

    .image-button img {
      display: block;
      width: 100%;
      height: auto;
    }

    .footer {
      text-align: center;
      color: white;
      padding: 20px 20px;
      margin-top: 20px;
    }

    .footer a {
      color: rgb(255, 255, 255);
      text-decoration: underline;
      font-size: 1.1em;
      font-weight: bold;
    }

    #toggleViewButton {
      background-color: #fa7325;
      border: none;
      padding: 6px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
      min-width: 32px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #toggleViewButton img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      pointer-events: none;
    }

    #toggleViewButton:hover {
      transform: scale(1.1);
    }

    /* Desktop-anpassning */
    @media (min-width: 1024px) {
      .hero {
        padding-top: 200px;
      }

      .hero-title-img {
        width: 100%;
        max-width: 1500px;
      }

      .button-grid {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); /* större kolumner */
        gap: 60px;           /* lite mer luft mellan knapparna */
        max-width: 1400px;   /* låter dem breda ut sig mer */
        padding: 40px;
      }

      .game-button {
        border: none;        /* tar bort rosa kant */
        min-height: 200px;   /* högre knappar */
        font-size: 1.4em;
        background-color: transparent;
        box-shadow: none;
        transition: transform 0.2s ease;
      }

      .game-button:hover {
        transform: scale(1.1);          /* bara lite större vid hover */
        background-color: transparent;  /* ingen svart rektangel */
      }

      .image-button img {
        border-radius: 10px;
      }

      #toggleViewButton {
        min-width: 40px;
        min-height: 40px;
      }

      #toggleViewButton img {
        width: 20px;
        height: 20px;
      }
    }

    @media (max-width: 600px) {
      .background {
        background-image: var(--bg-mobil);
      }

      .hero {
        height: 110vh;
        aspect-ratio: 4/5;
      }

      .game-button {
        border: 3px solid #fa7325;
        min-height: 150px;
        border-width: 2px;
        border-radius: 4px;
        background-color: transparent;
        box-shadow: none;
        font-size: 1em;
        font-weight: bold;
        font-family: 'Times New Roman', Times, serif;
        color: #ffffff;
        text-transform: uppercase;
        padding: 10px;
      }

      .game-button:hover {
        background-color: #000000;
        color: white;
        transform: scale(1.02);
      }

      .button-grid {
        gap: 50px;
        max-width: 90%;
        max-height: 100%;
        padding: 20px;
        grid-template-columns: 1fr;
      }

      .image-button {
        background: transparent;
        padding: 0;
        overflow: hidden;
        border: none;
      }

      .image-button img {
        max-height: 100%;
        object-fit: contain;
        border-radius: 6px;
      }

      .button-grid.grid-view {
        grid-template-columns: repeat(2, 1fr) !important;
        row-gap: 0px;
        column-gap: 40px;
      }

      .hero-title-img {
        width: 70%;
        max-width: 300px;
      }

      .view-toggle {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 10;
      }
    }
  </style>

  <!-- Förhämtar spelsidan när man håller musen över / trycker på en lek (Chrome/Edge),

    { "prefetch": [ { "where": { "selector_matches": ".game-button" }, "eagerness": "moderate" } ] }

  <script>
    /* Sätt bildadresserna (med versionsnummer) */
    var bilder = document.querySelectorAll("img[data-src]");
    for (var i = 0; i < bilder.length; i++) {
      bilder[i].src = v(bilder[i].getAttribute("data-src"));
    }

    /* Byt mellan list- och rutnätsvy */
    var toggleButton = document.getElementById("toggleViewButton");
    var toggleIcon = toggleButton.querySelector("img");
    var buttonGrid = document.querySelector(".button-grid");
    var gridIkon = new Image(); gridIkon.src = v("bilder/grid.png"); // förladdad, så bytet sker direkt

    toggleButton.addEventListener("click", function () {
      buttonGrid.classList.toggle("grid-view");
      toggleIcon.src = buttonGrid.classList.contains("grid-view") ? v("bilder/grid.png") : v("bilder/list.png");
    });

    /* Cache i besökarens webbläsare (service worker, se /sw.js – samma för hela sajten).
       Sidan själv hämtas alltid ny när man är online; bilderna sparas och
       byts ut automatiskt när VERSION ovan ändras. */
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});

        /* Spara alla sidans bilder i cachen i bakgrunden, så nästa besök går direkt */
        function forladda() {
          var sw = navigator.serviceWorker.controller;
          if (!sw) return;
          var urls = [v("bilder/webb/party3.webp"), v("bilder/webb/party3.2.webp"), v("bilder/webb/firepit2.webp"), v("bilder/grid.png")];
          for (var i = 0; i < bilder.length; i++) urls.push(v(bilder[i].getAttribute("data-src")));
          sw.postMessage({ typ: "forladda", urls: urls.map(function (u) { return new URL(u, location.href).href; }) });
        }
        navigator.serviceWorker.addEventListener("controllerchange", forladda);
        setTimeout(forladda, 1500);
      });
    }
  </script>
