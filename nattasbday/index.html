<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Nattas Bday</title>
  <style>
    body { font-family: 'Comic Sans MS', cursive, sans-serif; background: #fff7e6; }
    .karaktar { margin: 10px 0; padding: 15px; border-radius: 10px; border: 2px solid #ffb84d; background: #fff3e0; }
    .reserverad { background: #ffd6d6; border-color: #ff8080; }
    button { margin-left: 10px; padding: 5px 10px; background: #ffcc66; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #ffb84d; }
  </style>
</head>
<body>
  <h1>Reservera din karaktär</h1>
  <div id="lista">Laddar...</div>

  <script>
const API_URL = "https://script.google.com/macros/s/AKfycbwj29KVLTVv4h7JDsOgZfoecSiZjMPeCl66q_d0_3R0mSvsWtk46yrfAEi1L7J0cba3/exec";

async function hamtaKaraktarer() {
  const lista = document.getElementById("lista");
  try {
    const res = await fetch(API_URL + "?t=" + Date.now(), { mode: "cors" });
    const data = await res.json();

    if (!Array.isArray(data) || data.length <= 1) {
      lista.innerHTML = "<p>Inga karaktärer hittades.</p>";
      return;
    }

    lista.innerHTML = "";
    const rows = data.slice(1);
    rows.forEach(rad => {
      const namn = rad[0];
      const reserveradAv = rad[1];
      const tid = rad[2];

      const div = document.createElement("div");
      div.className = "karaktar" + (reserveradAv ? " reserverad" : "");

      const strong = document.createElement("strong");
      strong.textContent = namn;
      div.appendChild(strong);

      if (reserveradAv) {
        const span = document.createElement("span");
        span.textContent = ` (Reserverad)`;
        div.appendChild(span);
      } else {
        const btn = document.createElement("button");
        btn.textContent = "Boka";
        btn.addEventListener("click", () => boka(namn));
        div.appendChild(btn);
      }

      lista.appendChild(div);
    });

  } catch (err) {
    console.error(err);
    lista.innerHTML = `<p>Kunde inte ladda listan (${err.message}).</p>`;
  }
}


async function boka(namn) {
  const dittNamn = prompt(`Skriv ditt namn för att boka (kommer inte synas för andra)"${namn}":`);
  if (!dittNamn) return;

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        karaktar: namn,
        namn: dittNamn
      })
    });
    const resultat = await res.json();

    if (resultat.success) {
      alert(resultat.message || "Bokning lyckades!");
    } else {
      alert(resultat.message || "Kunde inte boka.");
    }
  } catch (e) {
    alert("Något gick fel vid bokningen.");
  }
  hamtaKaraktarer();
}

hamtaKaraktarer();
</script>

</body>
</html>
