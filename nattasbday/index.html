<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nattas Bday</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="pippi.ico">

  <style>
  body { 
    font-family: 'Times New Roman'; 
    margin: 0; 
    padding: 0 10px; 
    text-align: center;
    background-image: url('bakgrund2.png'); 
    background-size: cover;    
    background-position: center;
    background-repeat: no-repeat;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('bakgrund2.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -1;
  }

  h1 {
    text-align: center;
    margin-top: 20px;
    color: #ffb84d;
    font-size: 2.2em;
    font-family: 'Times New Roman';
    background: rgba(255, 243, 224, 0.9);
    display: inline-block;
    padding: 10px 20px;
    border-radius: 10px;
    border: 2px solid #ffb84d;
  }

  #lista {
    max-width: 600px;
    margin: 20px auto;
  }

  .karaktar { 
    margin: 10px 0; 
    padding: 15px; 
    border-radius: 10px; 
    border: 2px solid #ffb84d; 
    background: rgba(255, 243, 224, 0.75);
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    flex-wrap: wrap;
    font-size: 1.1em;
  }

  .reserverad { 
    background: #ffd6d6; 
    border-color: #ff8080; 
  }

  button { 
    padding: 8px 15px; 
    background: #ffcc66; 
    color: black; 
    border: none; 
    border-radius: 5px; 
    cursor: pointer; 
    margin-top: 5px;
    font-size: 1em;
    -webkit-tap-highlight-color: transparent;
  }

  button:hover { 
    background: #ffb84d; 
  }

  .karaktar span {
    margin-left: 8px;
  }

  #nyKaraktarContainer {
    max-width: 600px;
    margin: 30px auto;
    background: rgba(255, 243, 224, 0.75);
    border: 2px solid #ffb84d;
    border-radius: 10px;
    padding: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  #nyKaraktarInput {
    padding: 8px;
    flex: 1;
    min-width: 200px;
    border: 2px solid #ffb84d;
    border-radius: 5px;
    font-size: 1em;
  }

  /* Popup bakgrund */
  #popupBakgrund,
  #popupDirektBakgrund {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }

  /* Popup ruta */
  #popupRuta {
    background: rgba(255, 243, 224, 0.95);
    border: 2px solid #ffb84d;
    border-radius: 10px;
    padding: 20px;
    max-width: 300px;
    text-align: center;
    position: relative;
  }

  #popupRuta h2 {
    margin-top: 0;
    font-size: 1.2em;
    color: #333;
    gap: 12px;
  }

  #popupRuta input {
    max-width: 320px;
    padding: 8px;
    margin: 15px auto;
    border: 2px solid #ffb84d;
    border-radius: 5px;
    font-size: 1em;
  }

  /* Stäng-knapp */
  .stangPopup {
    position: absolute;
    top: 5px;
    right: 15px;
    cursor: pointer;
    font-size: 1.2em;
    color: #666;
  }

  /* --- Mobilanpassning --- */
  @media (max-width: 600px) {
    body { padding: 0 5px; }
    h1 { font-size: 1.8em; }
    .karaktar { 
      font-size: 1.2em;
      align-items: center;
      flex-wrap: wrap;
    }
    .karaktar strong,
    .karaktar span {
      max-width: 70%;
      word-wrap: break-word;
      overflow-wrap: break-word;
      display: inline-block;
    }
    button { font-size: 1em; padding: 10px 20px; }
    #nyKaraktarContainer { flex-direction: column; align-items: stretch; }
  }

</style>
</head>
<body>
  <h1>
      Vänligen reservera din utklädnad
  </h1>

  <div id="lista">Laddar...</div>

  <!-- Ny karaktärssektion -->
  <div id="nyKaraktarContainer">
    <input type="text" id="nyKaraktarInput" placeholder="Ny karaktär">
    <button id="laggTillBtn">Lägg till</button>
  </div>

  <!-- Popup -->
  <div id="popupBakgrund">
    <div id="popupRuta">
      <span class="stangPopup" onclick="stangPopup()">✖</span>
      <h2>Vill du reservera direkt eller lägga som förslag?</h2>
      <input type="text" id="namnInput" placeholder="Ditt namn (för reservering)" style="display:none;">
      <button id="reserveraDirektBtn">Reservera direkt</button>
      <button id="laggSomForslagBtn">Lägg till som förslag</button>
    </div>
  </div>

 <!-- Popup för befintlig karaktär -->
  <div id="popupDirektBakgrund" style="display:none;">
    <div id="popupRuta">
      <span class="stangPopup" onclick="stangPopupDirekt()">✖</span>
      <h2>Reservera karaktär</h2>
      <p id="popupDirektKaraktar"></p>
      <input type="text" id="namnDirektInput" placeholder="Ditt namn">
      <button id="bekraftaDirektBtn">Bekräfta</button>
    </div>
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxZW1Aok4CA5u7y-uKsTGLPh6xVdM2mzSz4xS8-MX6Vfa7SBTLiX6M-4v564LQ9QkH0/exec";
  let aktuellKaraktar = "";

  async function hamtaKaraktarer() {
    const lista = document.getElementById("lista");
    try {
      const res = await fetch(API_URL + "?t=" + Date.now(), { mode: "cors" });
      const data = await res.json();

      if (!Array.isArray(data) || data.length <= 1) {
        lista.innerHTML = "<p>Inga karaktärer hittades.</p>";
        return;
      }

      lista.innerHTML = "";
      let rows = data.slice(1); // förutsätter rubrikrad i rad 1

      // sortera – reserverade sist (eller först, beroende på preferens)
      rows.sort((a, b) => {
        const aRes = a[1] ? 1 : 0;
        const bRes = b[1] ? 1 : 0;
        return bRes - aRes; // ändra till bRes - aRes om du vill ha reserverade överst
      });

      rows.forEach(rad => {
        const karaktar = rad[0];
        const reserveradAv = rad[1];

        const div = document.createElement("div");
        div.className = "karaktar" + (reserveradAv ? " reserverad" : "");

        const textContainer = document.createElement("div");
        textContainer.style.flex = "1";
        textContainer.style.marginRight = "10px";

        const strong = document.createElement("strong");
        strong.textContent = karaktar;
        textContainer.appendChild(strong);

        if (reserveradAv) {
          const span = document.createElement("span");
          span.textContent = "(Reserverad)";
          span.style.marginLeft = "8px";
          textContainer.appendChild(span);
        }

        div.appendChild(textContainer);

        if (!reserveradAv) {
          const btn = document.createElement("button");
          btn.textContent = "Reservera";
          btn.style.color = "black";
          btn.addEventListener("click", (e) => boka(karaktar, e.target));
          div.appendChild(btn);
        }

        lista.appendChild(div);
      });

    } catch (err) {
      console.error(err);
      lista.innerHTML = `<p>Kunde inte ladda listan (${err.message}).</p>`;
    }
  }

  // Vanlig reservation av befintlig karaktär
async function boka(karaktar, knappElement) {
  aktuellKaraktar = karaktar;
  document.getElementById("namnDirektInput").value = "";
  document.getElementById("popupDirektKaraktar").textContent = karaktar;
  document.getElementById("popupDirektBakgrund").style.display = "flex";
}


// Stäng popupDirekt
function stangPopupDirekt() {
  document.getElementById("popupDirektBakgrund").style.display = "none";
}

// Bekräfta direkt-reservation
document.getElementById("bekraftaDirektBtn").addEventListener("click", async () => {
  const dittNamn = document.getElementById("namnDirektInput").value.trim();
  if (!dittNamn) {
    alert("Skriv ditt namn!");
    return;
  }

  // 🔹 Optimistisk uppdatering direkt i listan
  const lista = document.getElementById("lista");
  const divar = lista.querySelectorAll(".karaktar");
  divar.forEach(div => {
    const strong = div.querySelector("strong");
    if (strong && strong.textContent === aktuellKaraktar) {
      div.classList.add("reserverad");
      let span = div.querySelector("span");
      if (!span) {
        span = document.createElement("span");
        div.querySelector("div").appendChild(span);
      }
      span.textContent = "(Reserverad)";
      const btn = div.querySelector("button");
      if (btn) btn.remove(); // ta bort reservera-knappen
    }
  });

  stangPopupDirekt(); // stäng popup direkt

  // 🔹 Skicka till servern i bakgrunden
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        action: "reserve",
        karaktar: aktuellKaraktar,
        namn: dittNamn
      })
    });

    const resultat = await res.json();
    if (!resultat.success) {
      alert(resultat.message || "Kunde inte reservera.");
      // ⚠ Om du vill kan du här återställa listan genom att köra om hamtaKaraktarer();
      hamtaKaraktarer();
      return;
    }

    // ✅ Om allt gick bra, hämta fräscha data så allt är synkat
    hamtaKaraktarer();

  } catch (e) {
    alert("Nätverksfel: kunde inte reservera.");
    // ⚠ Återställ med senaste data
    hamtaKaraktarer();
  }
});


  // Popup: öppna
  document.getElementById("laggTillBtn").addEventListener("click", () => {
    aktuellKaraktar = document.getElementById("nyKaraktarInput").value.trim();
    if (!aktuellKaraktar) {
      alert("Skriv in en karaktär först!");
      return;
    }
    document.getElementById("namnInput").value = "";
    document.getElementById("namnInput").style.display = "none";
    document.getElementById("laggSomForslagBtn").style.display = "inline-block";
    document.getElementById("popupBakgrund").style.display = "flex";
  });

  // Popup: reservera direkt (tvåsteg – visa input, sen skicka)
  document.getElementById("reserveraDirektBtn").addEventListener("click", async () => {
  const namnInput = document.getElementById("namnInput");
  const laggSomForslagBtn = document.getElementById("laggSomForslagBtn");
  const reserveraDirektBtn = document.getElementById("reserveraDirektBtn");

  if (namnInput.style.display === "none") {
    namnInput.style.display = "block";
    laggSomForslagBtn.style.display = "none";
    namnInput.focus();
    return;
  }

  const namn = namnInput.value.trim();
  if (!namn) {
    alert("Skriv ditt namn för att reservera!");
    return;
  }

  // 🔹 Optimistisk uppdatering – lägg in karaktären direkt i listan
  const lista = document.getElementById("lista");
  const div = document.createElement("div");
  div.className = "karaktar reserverad";

  const textContainer = document.createElement("div");
  textContainer.style.flex = "1";
  textContainer.style.marginRight = "10px";

  const strong = document.createElement("strong");
  strong.textContent = aktuellKaraktar;
  textContainer.appendChild(strong);

  const span = document.createElement("span");
  span.textContent = "(Reserverad)";
  span.style.marginLeft = "8px";
  textContainer.appendChild(span);

  div.appendChild(textContainer);
  lista.insertBefore(div, lista.firstChild); // lägg överst

  // 🔹 Stäng popup direkt
  stangPopup();

  // 🔹 Skicka till servern i bakgrunden
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        action: "add",
        karaktar: aktuellKaraktar,
        namn: namn
      })
    });

    const resultat = await res.json();

    if (!resultat.success) {
      alert(resultat.message || "Kunde inte reservera.");
      hamtaKaraktarer(); // återställ om fel
      return;
    }

    // ✅ Synka listan med servern
    hamtaKaraktarer();

  } catch (e) {
    alert("Nätverksfel: kunde inte reservera.");
    hamtaKaraktarer(); // återställ om nätverksfel
  }
});


  // Popup: lägg som förslag (utan namn)
  document.getElementById("laggSomForslagBtn").addEventListener("click", async (e) => {
  const knapp = e.target;
  const originalText = knapp.textContent;
  const reserveraDirektBtn = document.getElementById("reserveraDirektBtn");

  // Ändra text på knappen som tryckts
  knapp.textContent = "Lägger till...";
  knapp.disabled = true;

  // Dölj reservera-direkt knappen
  reserveraDirektBtn.style.display = "none";

  await laggTillKaraktar(aktuellKaraktar, "");

  // Återställ "lägg till"-knappen (popup stängs ändå vid success)
  knapp.textContent = originalText;
  knapp.disabled = false;
});



  function stangPopup() {
    document.getElementById("popupBakgrund").style.display = "none";
    document.getElementById("namnInput").value = "";
    document.getElementById("namnInput").style.display = "none";
  }

  // Lägg till ny karaktär (med eller utan direkt reservation)
  async function laggTillKaraktar(karaktarNamn, dittNamn) {
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "add",            // 👈 alltid "add"
          karaktar: karaktarNamn,
          namn: dittNamn            // "" = förslag, annars direkt reserverad
        })
      });

      const resultat = await res.json();

      if (resultat.success) {
        document.getElementById("nyKaraktarInput").value = "";
        stangPopup();
        hamtaKaraktarer();
      } else {
        alert(resultat.message || "Kunde inte lägga till karaktären.");
      }
    } catch (e) {
      alert("Något gick fel vid tillägg.");
    }
  }

  hamtaKaraktarer();
</script>

</body>
</html>
