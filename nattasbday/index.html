<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nattas Bday</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
  body { 
    font-family: 'Times New Roman'; 
    margin: 0; 
    padding: 0 10px; 
    text-align: center;
    background-image: url('bakgrund2.png'); 
    background-size: cover;    
    background-position: center;
    background-repeat: no-repeat;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('bakgrund2.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -1;
  }

  h1 {
    text-align: center;
    margin-top: 20px;
    color: #ffb84d;
    font-size: 2.2em;
    font-family: 'Times New Roman';
    background: rgba(255, 243, 224, 0.9);
    display: inline-block;
    padding: 10px 20px;
    border-radius: 10px;
    border: 2px solid #ffb84d;
  }

  #lista {
    max-width: 600px;
    margin: 20px auto;
  }

  .karaktar { 
    margin: 10px 0; 
    padding: 15px; 
    border-radius: 10px; 
    border: 2px solid #ffb84d; 
    background: rgba(255, 243, 224, 0.75);
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    flex-wrap: wrap;
    font-size: 1.1em;
  }

  .reserverad { 
    background: #ffd6d6; 
    border-color: #ff8080; 
  }

  button { 
    padding: 8px 15px; 
    background: #ffcc66; 
    color: black; 
    border: none; 
    border-radius: 5px; 
    cursor: pointer; 
    margin-top: 5px;
    font-size: 1em;
    -webkit-tap-highlight-color: transparent;
  }

  button:hover { 
    background: #ffb84d; 
  }

  .karaktar span {
    margin-left: 8px;
  }

  #nyKaraktarContainer {
    max-width: 600px;
    margin: 30px auto;
    background: rgba(255, 243, 224, 0.75);
    border: 2px solid #ffb84d;
    border-radius: 10px;
    padding: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  #nyKaraktarInput {
    padding: 8px;
    flex: 1;
    min-width: 200px;
    border: 2px solid #ffb84d;
    border-radius: 5px;
    font-size: 1em;
  }

  /* Popup bakgrund */
  #popupBakgrund {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }

  /* Popup ruta */
  #popupRuta {
    background: rgba(255, 243, 224, 0.95);
    border: 2px solid #ffb84d;
    border-radius: 10px;
    padding: 20px;
    max-width: 300px;
    text-align: center;
    position: relative;
  }

  #popupRuta h2 {
    margin-top: 0;
    font-size: 1.2em;
    color: #333;
  }

  #popupRuta input {
    width: 100%;
    padding: 8px;
    margin: 10px 0;
    border: 2px solid #ffb84d;
    border-radius: 5px;
    font-size: 1em;
  }

  /* Stäng-knapp */
  .stangPopup {
    position: absolute;
    top: 5px;
    right: 10px;
    cursor: pointer;
    font-size: 1.2em;
    color: #666;
  }

  /* --- Mobilanpassning --- */
  @media (max-width: 600px) {
    body { padding: 0 5px; }
    h1 { font-size: 1.8em; }
    .karaktar { 
      font-size: 1.2em;
      align-items: center;
      flex-wrap: wrap;
    }
    .karaktar strong,
    .karaktar span {
      max-width: 70%;
      word-wrap: break-word;
      overflow-wrap: break-word;
      display: inline-block;
    }
    button { font-size: 1em; padding: 10px 20px; }
    #nyKaraktarContainer { flex-direction: column; align-items: stretch; }
  }

</style>
</head>
<body>
  <h1>
    Välkommen till Nathalies födelsedag
    <span style="display:block; margin-top:20px; font-size:0.9em;">
      Vänligen reservera din utklädnad
    </span>
  </h1>

  <div id="lista">Laddar...</div>

  <!-- Ny karaktärssektion -->
  <div id="nyKaraktarContainer">
    <input type="text" id="nyKaraktarInput" placeholder="Ny karaktär">
    <button id="laggTillBtn">Lägg till</button>
  </div>

  <!-- Popup -->
  <div id="popupBakgrund">
    <div id="popupRuta">
      <span class="stangPopup" onclick="stangPopup()">✖</span>
      <h2>Vill du reservera direkt eller lägga som förslag?</h2>
      <input type="text" id="namnInput" placeholder="Ditt namn (vid reservering)" style="display:none;">
      <button id="reserveraDirektBtn">Reservera direkt</button>
      <button id="laggSomForslagBtn">Lägg som förslag</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwj29KVLTVv4h7JDsOgZfoecSiZjMPeCl66q_d0_3R0mSvsWtk46yrfAEi1L7J0cba3/exec";
    let aktuellKaraktar = "";

    async function hamtaKaraktarer() {
      const lista = document.getElementById("lista");
      try {
        const res = await fetch(API_URL + "?t=" + Date.now(), { mode: "cors" });
        const data = await res.json();

        if (!Array.isArray(data) || data.length <= 1) {
          lista.innerHTML = "<p>Inga karaktärer hittades.</p>";
          return;
        }

        lista.innerHTML = "";
        let rows = data.slice(1);

        rows.sort((a, b) => {
          const aRes = a[1] ? 1 : 0;
          const bRes = b[1] ? 1 : 0;
          return bRes - aRes;
        });

        rows.forEach(rad => {
          const namn = rad[0];
          const reserveradAv = rad[1];

          const div = document.createElement("div");
          div.className = "karaktar" + (reserveradAv ? " reserverad" : "");

          const textContainer = document.createElement("div");
          textContainer.style.flex = "1";
          textContainer.style.marginRight = "10px";

          const strong = document.createElement("strong");
          strong.textContent = namn;
          textContainer.appendChild(strong);

          if (reserveradAv) {
            const span = document.createElement("span");
            span.textContent = "(Reserverad)";
            span.style.marginLeft = "8px";
            textContainer.appendChild(span);
          }

          div.appendChild(textContainer);

          if (!reserveradAv) {
            const btn = document.createElement("button");
            btn.textContent = "Reservera";
            btn.style.color = "black";
            btn.addEventListener("click", (e) => boka(namn, e.target));
            div.appendChild(btn);
          }

          lista.appendChild(div);
        });

      } catch (err) {
        console.error(err);
        lista.innerHTML = `<p>Kunde inte ladda listan (${err.message}).</p>`;
      }
    }

    async function boka(namn, knappElement) {
      const dittNamn = prompt(`Skriv ditt namn för att boka "${namn}":`);
      if (!dittNamn) return;

      knappElement.remove();
      const karaktarDiv = knappElement.closest(".karaktar");
      const span = document.createElement("span");
      span.textContent = "(Reserverad)";
      span.style.marginLeft = "8px";
      karaktarDiv.querySelector("div").appendChild(span);
      karaktarDiv.classList.add("reserverad");

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ karaktar: namn, namn: dittNamn })
        });
      } catch (e) {
        hamtaKaraktarer();
      }
    }

    document.getElementById("laggTillBtn").addEventListener("click", () => {
      aktuellKaraktar = document.getElementById("nyKaraktarInput").value.trim();
      if (!aktuellKaraktar) {
        alert("Skriv in en karaktär först!");
        return;
      }
      document.getElementById("popupBakgrund").style.display = "flex";
    });

    document.getElementById("reserveraDirektBtn").addEventListener("click", () => {
      document.getElementById("namnInput").style.display = "block";
      const namn = document.getElementById("namnInput").value.trim();
      if (!namn) {
        alert("Skriv ditt namn för att reservera!");
        return;
      }
      laggTillKaraktar(aktuellKaraktar, namn);
    });

    document.getElementById("laggSomForslagBtn").addEventListener("click", () => {
      laggTillKaraktar(aktuellKaraktar, "");
    });

    function stangPopup() {
      document.getElementById("popupBakgrund").style.display = "none";
      document.getElementById("namnInput").value = "";
      document.getElementById("namnInput").style.display = "none";
    }

    async function laggTillKaraktar(karaktarNamn, dittNamn) {
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({
            karaktar: karaktarNamn,
            namn: dittNamn
          })
        });
        const resultat = await res.json();

        if (resultat.success) {
          document.getElementById("nyKaraktarInput").value = "";
          stangPopup();
          hamtaKaraktarer();
        } else {
          alert(resultat.message || "Kunde inte lägga till karaktären.");
        }
      } catch (e) {
        alert("Något gick fel vid tillägg.");
      }
    }

    hamtaKaraktarer();
  </script>
</body>
</html>
