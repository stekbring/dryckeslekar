<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nattas Bday</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
  body { 
    font-family: 'Times New Roman'; 
    margin: 0; 
    padding: 0 10px; 
    text-align: center;

    /* Fast bakgrund */
    background-image: url('bakgrund2.png'); 
    background-size: cover;    
    background-position: center;
    background-repeat: no-repeat;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('bakgrund2.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -1; /* ser till att allt innehåll ligger ovanför */
  }

  h1 {
    text-align: center;
    margin-top: 20px;
    color: #ffb84d;
    font-size: 2.2em;
    font-family: 'Times New Roman';

    background: rgba(255, 243, 224, 0.8); /* semi-transparent bakgrund */
    display: inline-block; /* bara bakom texten */
    padding: 10px 20px;
    border-radius: 10px;
    
    /* Samma border som knapparna */
    border: 2px solid #ffb84d;
  }


  #lista {
    max-width: 600px;
    margin: 20px auto;
  }

  .karaktar { 
  margin: 10px 0; 
  padding: 15px; 
  border-radius: 10px; 
  border: 2px solid #ffb84d; 
  background: rgba(255, 243, 224, 0.8); /* transparent så bakgrunden syns */
  display: flex; 
  justify-content: space-between; 
  align-items: center;
  flex-wrap: wrap;
  font-size: 1.1em;
}

  .reserverad { 
    background: #ffd6d6; 
    border-color: #ff8080; 
  }

  button { 
    padding: 8px 15px; 
    background: #ffcc66; 
    color: black; /* alltid svart text */
    border: none; 
    border-radius: 5px; 
    cursor: pointer; 
    margin-top: 5px;
    font-size: 1em;
    -webkit-tap-highlight-color: transparent; /* tar bort blå markeringsfärg på mobil */
  }

  button:hover { 
    background: #ffb84d; 
  }

  .karaktar span {
    margin-left: 8px; /* extra spacing mellan namn och (Reserverad) */
  }

  /* --- Mobilanpassning --- */
  @media (max-width: 600px) {
    body { padding: 0 5px; }
    h1 { 
      font-size: 2em; 
    }
    .karaktar { 
      font-size: 1.2em;
      align-items: flex-start;
      flex-wrap: nowrap;
    }
    .karaktar strong,
    .karaktar span {
      max-width: 70%;
      word-wrap: break-word;
      overflow-wrap: break-word;
      display: inline-block;
    }
    button { 
      font-size: 1em; 
      padding: 10px 20px;
    }
  }
</style>
</head>
<body>
  <h1>Reservera din utklädnad</h1>
  <div id="lista">Laddar...</div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwj29KVLTVv4h7JDsOgZfoecSiZjMPeCl66q_d0_3R0mSvsWtk46yrfAEi1L7J0cba3/exec";

    async function hamtaKaraktarer() {
  const lista = document.getElementById("lista");
  try {
    const res = await fetch(API_URL + "?t=" + Date.now(), { mode: "cors" });
    const data = await res.json();

    if (!Array.isArray(data) || data.length <= 1) {
      lista.innerHTML = "<p>Inga karaktärer hittades.</p>";
      return;
    }

    lista.innerHTML = "";
    let rows = data.slice(1);

    // Sortera så att reserverade hamnar först
    rows.sort((a, b) => {
      const aRes = a[1] ? 1 : 0;
      const bRes = b[1] ? 1 : 0;
      return bRes - aRes; // reserverade först
    });

    rows.forEach(rad => {
      const namn = rad[0];
      const reserveradAv = rad[1];

      const div = document.createElement("div");
      div.className = "karaktar" + (reserveradAv ? " reserverad" : "");

      const textContainer = document.createElement("div");
      textContainer.style.flex = "1";
      textContainer.style.marginRight = "10px";

      const strong = document.createElement("strong");
      strong.textContent = namn;
      textContainer.appendChild(strong);

      if (reserveradAv) {
        const span = document.createElement("span");
        span.textContent = "(Reserverad)";
        span.style.marginLeft = "8px"; // extra spacing
        textContainer.appendChild(span);
      }

      div.appendChild(textContainer);

      if (!reserveradAv) {
        const btn = document.createElement("button");
        btn.textContent = "Reservera";
        btn.style.color = "black"; // svart text på mobil
        btn.addEventListener("click", (e) => boka(namn, e.target));
        div.appendChild(btn);
      }

      lista.appendChild(div);
    });

  } catch (err) {
    console.error(err);
    lista.innerHTML = `<p>Kunde inte ladda listan (${err.message}).</p>`;
  }
}


    async function boka(namn, knappElement) {
      const dittNamn = prompt(`Skriv ditt namn för att boka "${namn}"   (namnet kommer inte synas för andra):`);
      if (!dittNamn) return;

      const karaktarDiv = knappElement.closest(".karaktar");

      // Ta bort knappen
      knappElement.remove();

      // Lägg till reserverad text och klass direkt
      const span = document.createElement("span");
      span.textContent = "(Reserverad)";
      span.style.marginLeft = "8px";
      karaktarDiv.querySelector("div").appendChild(span);
      karaktarDiv.classList.add("reserverad");

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ karaktar: namn, namn: dittNamn })
        });
        const resultat = await res.json();

        if (resultat.success) {
          alert(resultat.message || "Reserveringen lyckades!");
        } else {
          alert(resultat.message || "Kunde inte reservera.");
          hamtaKaraktarer(); // tar bort reservering om det misslyckas
        }
      } catch (e) {
        alert("Något gick fel vid bokningen.");
        hamtaKaraktarer();
      }
    }

    hamtaKaraktarer();
  </script>
</body>
</html>
