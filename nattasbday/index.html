<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nattas Bday</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
  body { 
    font-family: 'Comic Sans MS', cursive, sans-serif; 
    background: #fff7e6; 
    margin: 0; 
    padding: 0 10px; 
  }

  h1 {
    text-align: center;
    margin-top: 20px;
    color: #ff8000;
    font-size: 2.2em;
    font-family: 'Times New Roman';
  }

  #lista {
    max-width: 600px;
    margin: 20px auto;
  }

  .karaktar { 
    margin: 10px 0; 
    padding: 15px; 
    border-radius: 10px; 
    border: 2px solid #ffb84d; 
    background: #fff3e0; 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    flex-wrap: wrap;
    font-size: 1.1em;
  }

  .reserverad { 
    background: #ffd6d6; 
    border-color: #ff8080; 
  }

  button { 
    padding: 8px 15px; 
    background: #ffcc66; 
    border: none; 
    border-radius: 5px; 
    cursor: pointer; 
    margin-top: 5px;
    font-size: 1em;
  }

  button:hover { 
    background: #ffb84d; 
  }

  /* --- Mobilanpassning --- */
  @media (max-width: 600px) {
    body { padding: 0 5px; }
    h1 { 
      font-size: 2em; 
    }
    .karaktar { 
      font-size: 1.2em;
      align-items: flex-start; /* så knappen inte trycks ner */
      flex-wrap: nowrap;       /* håll text och knapp på samma rad */
    }
    .karaktar strong,
    .karaktar span {
      max-width: 70%;
      word-wrap: break-word;
      overflow-wrap: break-word;
      display: inline-block;
    }
    button { 
      font-size: 1em; 
      padding: 10px 20px;
    }
  }
</style>
</head>
<body>
  <h1>Reservera din utklädnad</h1>
  <div id="lista">Laddar...</div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwj29KVLTVv4h7JDsOgZfoecSiZjMPeCl66q_d0_3R0mSvsWtk46yrfAEi1L7J0cba3/exec";

    async function hamtaKaraktarer() {
      const lista = document.getElementById("lista");
      try {
        const res = await fetch(API_URL + "?t=" + Date.now(), { mode: "cors" });
        const data = await res.json();

        if (!Array.isArray(data) || data.length <= 1) {
          lista.innerHTML = "<p>Inga karaktärer hittades.</p>";
          return;
        }

        lista.innerHTML = "";
        const rows = data.slice(1);
        rows.forEach(rad => {
          const namn = rad[0];
          const reserveradAv = rad[1];

          const div = document.createElement("div");
          div.className = "karaktar" + (reserveradAv ? " reserverad" : "");

          const textContainer = document.createElement("div");
          textContainer.style.flex = "1";
          textContainer.style.marginRight = "10px";

          const strong = document.createElement("strong");
          strong.textContent = namn;
          textContainer.appendChild(strong);

          if (reserveradAv) {
            const span = document.createElement("span");
            span.textContent = ` (Reserverad)`;
            textContainer.appendChild(span);
          }

          div.appendChild(textContainer);

          if (!reserveradAv) {
            const btn = document.createElement("button");
            btn.textContent = "Reservera";
            btn.addEventListener("click", () => boka(namn));
            div.appendChild(btn);
          }

          lista.appendChild(div);
        });

      } catch (err) {
        console.error(err);
        lista.innerHTML = `<p>Kunde inte ladda listan (${err.message}).</p>`;
      }
    }

    async function boka(namn) {
      const dittNamn = prompt(`Skriv ditt namn för att boka "${namn}"   (namnet kommer inte synas för andra):`);
      if (!dittNamn) return;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ karaktar: namn, namn: dittNamn })
        });
        const resultat = await res.json();

        if (resultat.success) {
          alert(resultat.message || "Bokning lyckades!");
        } else {
          alert(resultat.message || "Kunde inte boka.");
        }
      } catch (e) {
        alert("Något gick fel vid bokningen.");
      }
      hamtaKaraktarer();
    }

    hamtaKaraktarer();
  </script>
</body>
</html>
