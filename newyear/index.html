<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>New Year Treasure Hunt</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Observera: newyearico.ico måste finnas i samma mapp för att ikonen ska synas -->
<link rel="icon" type="image/x-icon" href="newyearico.ico">

<style>
    body, html { margin: 0; padding: 0; height: 100%; background: #111; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .main-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; box-sizing: border-box; }
    
    /* Uppdaterad H1 för att matcha väntesidan */
    h1 { 
        text-align: center; 
        margin-bottom: 20px; 
        font-size: 28px; 
        font-weight: 600; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
        color: #ffd700; /* Guld */
    }

    .game-card { width: 100%; max-width: 500px; background: #1a1a1a; padding: 15px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #252525; padding: 10px 20px; border-radius: 12px; }
    button { padding: 0; font-size: 24px; cursor: pointer; border: none; border-radius: 8px; background: #444; color: #fff; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    button:active { background: #666; transform: scale(0.95); }
    #floorDisplay { display: flex; flex-direction: column; align-items: center; }
    #floorLabel { font-size: 10px; color: #888; text-transform: uppercase; }
    #floorNumber { font-size: 24px; font-weight: bold; color: #ffd700; }
    .map-container { position: relative; width: 100%; height: 60vh; max-height: 500px; min-height: 300px; }
    #map { width: 100%; height: 100%; border-radius: 12px; background: #222; z-index: 1; }
    
    /* LADDNINGSSYMBOL */
    .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; border: 5px solid rgba(255, 255, 255, 0.1); border-top: 5px solid #ffd700; border-radius: 50%; animation: spin 1s linear infinite; z-index: 1000; display: none; pointer-events: none; }
    @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    
    .leaflet-bar a { background-color: #333; color: #fff; border-bottom: 1px solid #444; }
    .leaflet-container { background: #222; }

    /* NY STIL FÖR KOD-INPUT */
    .code-section { margin-top: 20px; display: flex; gap: 10px; width: 100%; }
    #secretCode { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #333; color: white; font-size: 16px; outline: none; }
    #secretCode:focus { border-color: #ffd700; }
    #submitCode { width: auto; padding: 0 20px; font-size: 16px; background: #ffd700; color: #000; font-weight: bold; }
    #submitCode:active { background: #e5c100; }
    #messageArea { margin-top: 10px; min-height: 20px; font-size: 14px; color: #ffd700; text-align: center; font-weight: 500; }

    /* NOLLSTÄLLNINGSKNAPP */
    .reset-section { margin-top: 20px; text-align: center; border-top: 1px solid #333; padding-top: 15px; }
    #resetGame { 
        background: transparent; 
        color: #ff4444; 
        border: 1px solid #ff4444; 
        font-size: 14px; 
        width: auto; 
        height: auto; 
        padding: 8px 16px; 
        font-weight: normal; 
    }
    #resetGame:active { background: #ff4444; color: #fff; }
</style>
</head>
<body>

<div class="main-wrapper">
    <h1>New Year Hunt</h1>
    <div class="game-card">
        <div id="controls">
            <button id="floorDown" aria-label="Gå ner"> − </button>
            <div id="floorDisplay">
                <span id="floorLabel">Våning</span>
                <span id="floorNumber">0</span>
            </div>
            <button id="floorUp" aria-label="Gå upp"> + </button>
        </div>
        <div class="map-container">
            <div id="loader" class="loader"></div>
            <div id="map"></div>
        </div>

        <!-- NYTT: Input för kod -->
        <div class="code-section">
            <input type="text" id="secretCode" placeholder="Ange hemlig kod..." autocomplete="off">
            <button id="submitCode">Lås upp</button>
        </div>
        <div id="messageArea"></div>

        <!-- NYTT: Nollställningsknapp -->
        <div class="reset-section">
            <button id="resetGame">Nollställ spelet</button>
        </div>

    </div>
</div>

<script>
// ===========================
//  INSTÄLLNINGAR
// ===========================

// VIKTIGT: Kontrollera mappen 'tiles/1/0/0/'. Heter filen '0.png' eller '0.jpg'?
const fileExtension = ".png"; 

// BILDENS STORLEK (Pixlar)
const imgWidth = 11199;
const imgHeight = 14999;

const floorPaths = [
    `tiles/0/{z}/{x}/{y}${fileExtension}`,
    `tiles/1/{z}/{x}/{y}${fileExtension}`,
    `tiles/2/{z}/{x}/{y}${fileExtension}`,
    `tiles/3/{z}/{x}/{y}${fileExtension}`
];

// ===========================
//  HEMLIGA PLATSER (REDIGERA HÄR)
// ===========================
// Koordinater (x, y) är pixlar på originalbilden. 
// x=0, y=0 är uppe till vänster.
const secretLocations = [
    { id: 1, code: "NYÅR",  floor: 0, x: 2000, y: 3000, title: "Startpunkten", msg: "Grattis! Du hittade startpunkten." },
    { id: 2, code: "GULD",  floor: 1, x: 5500, y: 7500, title: "Gömstället",   msg: "Bra jobbat! En ledtråd finns här." },
    { id: 3, code: "RAKET", floor: 2, x: 8000, y: 4000, title: "Utsikten",     msg: "Här har du bra utsikt!" },
    { id: 4, code: "2025",  floor: 0, x: 5000, y: 10060, title: "Katakomberna",    msg: "Se upp för råttorna..." },
    { id: 5, code: "SKÅL",  floor: 2, x: 5120, y: 10245, title: "Den sista skatten",       msg: "Den gömdaste av de gömsta" }
];

// Ladda upplåsta platser från minnet
let unlockedIds = JSON.parse(localStorage.getItem('unlockedLocations') || "[]");
// Ladda senast sparade våning (eller 3 om ingen finns)
let savedFloor = parseInt(localStorage.getItem('currentFloor'));
if (isNaN(savedFloor)) savedFloor = 3;


// ===========================
//  SKAPA KARTA
// ===========================
const map = L.map("map", {
    crs: L.CRS.Simple, 
    minZoom: 2,        
    maxZoom: 6,        
    zoomControl: false, 
    attributionControl: false,
    maxBoundsViscosity: 0.85
});

L.control.zoom({ position: 'bottomright' }).addTo(map);

// Lager för markörer - ÄNDRAT TILL FeatureGroup för att stödja bringToFront()
const markersLayer = L.featureGroup().addTo(map);

const southWest = map.unproject([0, imgHeight], map.getMaxZoom());
const northEast = map.unproject([imgWidth, 0], map.getMaxZoom());
const bounds = L.latLngBounds(southWest, northEast);

map.setMaxBounds(bounds);
map.fitBounds(bounds);
map.setZoom(map.getZoom() + 1);

let currentFloor = -1;
let currentLayer = null;
const floorNumDisplay = document.getElementById("floorNumber");
const loader = document.getElementById("loader");
const messageArea = document.getElementById("messageArea");

function setLoading(loading) {
    loader.style.display = loading ? 'block' : 'none';
}

// ===========================
//  DEFINIERA IKON (Rött Kryss)
// ===========================
const redCrossIcon = L.icon({
    // Uppdaterad: stroke-width ändrad från 4 till 3 för ett smalare kryss
    iconUrl: 'data:image/svg+xml;charset=utf-8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="%23ff0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
    iconSize: [40, 40],   
    iconAnchor: [20, 20], 
    popupAnchor: [0, -20] 
});


// ===========================
//  HANTERA MARKÖRER
// ===========================
function updateMarkers() {
    markersLayer.clearLayers(); // Ta bort gamla markörer

    secretLocations.forEach(loc => {
        // Visa bara om platsen är upplåst OCH vi är på rätt våning
        if (unlockedIds.includes(loc.id) && loc.floor === currentFloor) {
            
            const latLng = map.unproject([loc.x, loc.y], map.getMaxZoom());
            const marker = L.marker(latLng, { icon: redCrossIcon }).addTo(markersLayer);
            marker.bindPopup(`<b>${loc.title}</b><br>${loc.msg}`);
        }
    });
}

// ===========================
//  HANTERA KODER
// ===========================
function checkCode() {
    const input = document.getElementById("secretCode");
    const code = input.value.trim().toUpperCase(); 
    
    const foundLocation = secretLocations.find(loc => loc.code === code);

    if (foundLocation) {
        if (!unlockedIds.includes(foundLocation.id)) {
            // Ny upplåsning
            unlockedIds.push(foundLocation.id);
            localStorage.setItem('unlockedLocations', JSON.stringify(unlockedIds));
            
            messageArea.textContent = `✅ Plats upplåst: ${foundLocation.title} (Våning ${foundLocation.floor})`;
            messageArea.style.color = "#4caf50"; 
            
            if (currentFloor !== foundLocation.floor) {
                switchFloor(foundLocation.floor);
            } else {
                updateMarkers();
            }
            
            const latLng = map.unproject([foundLocation.x, foundLocation.y], map.getMaxZoom());
            
            // Lade till { duration: 3 } för att göra animationen långsammare (3 sekunder)
            map.flyTo(latLng, 5, {
                animate: true,
                duration: 2.5 
            });

        } else {
            messageArea.textContent = "⚠️ Den här platsen är redan upplåst.";
            messageArea.style.color = "#ffd700";
        }
        input.value = ""; 
    } else {
        messageArea.textContent = "❌ Felaktig kod.";
        messageArea.style.color = "#ff4444";
    }

    setTimeout(() => { messageArea.textContent = ""; }, 5000);
}

// ===========================
//  NOLLSTÄLL SPELET
// ===========================
function resetGame() {
    if(confirm("Är du säker på att du vill nollställa alla framsteg?")) {
        unlockedIds = [];
        localStorage.removeItem('unlockedLocations');
        // Vi tar INTE bort currentFloor så man stannar där man är, men rensar upplåsningar
        updateMarkers();
        messageArea.textContent = "🔄 Spelet är nollställt.";
        messageArea.style.color = "#fff";
        setTimeout(() => { messageArea.textContent = ""; }, 3000);
    }
}


// ===========================
//  BYT VÅNING
// ===========================
function switchFloor(newFloor) {
    if (newFloor < 0 || newFloor >= floorPaths.length) return;
    if (newFloor === currentFloor) return; 

    setLoading(true);

    if (currentLayer) map.removeLayer(currentLayer);

    currentFloor = newFloor;
    
    // SPARA VÅNING I MINNET
    localStorage.setItem('currentFloor', currentFloor);

    const newLayer = L.tileLayer(floorPaths[currentFloor], {
        minZoom: 2,
        maxZoom: 6,
        tileSize: 256,
        noWrap: true,
        tms: false,
        attribution: '',
        bounds: bounds
    });
    
    newLayer.on('load', function() { setLoading(false); });
    newLayer.addTo(map);
    currentLayer = newLayer; 

    markersLayer.bringToFront();
    updateMarkers();

    setTimeout(() => setLoading(false), 5000);

    floorNumDisplay.style.opacity = 0;
    setTimeout(() => {
        floorNumDisplay.textContent = currentFloor;
        floorNumDisplay.style.opacity = 1;
    }, 150);
}

// ===========================
//  EVENT LISTENERS
// ===========================
document.getElementById("floorUp").onclick = () => switchFloor(currentFloor + 1);
document.getElementById("floorDown").onclick = () => switchFloor(currentFloor - 1);
document.getElementById("submitCode").onclick = checkCode;
document.getElementById("resetGame").onclick = resetGame;

document.getElementById("secretCode").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        checkCode();
    }
});

// Starta på sparad våning (eller 3 om ingen finns)
switchFloor(savedFloor);

window.addEventListener('resize', () => {
    map.invalidateSize();
});

</script>

</body>
</html>
