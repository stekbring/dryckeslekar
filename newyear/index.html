<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>New Year Treasure Hunt</title>

<!-- LEAFLET -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Bytte till MedievalSharp för Viking/Orakel-känsla -->
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

<link rel="icon" type="image/x-icon" href="newyearico.ico">

<style>
    body, html { margin: 0; padding: 0; height: 100%; background: #111; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    .main-wrapper { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: flex-end; /* Trycker innehållet mot botten */
        min-height: 100vh; 
        padding: 10px; 
        padding-bottom: 3vh; /* Lite luft under kortet */
        box-sizing: border-box; 
    }
    
    /* H1 Rubrik */
    h1 { 
        text-align: center; 
        font-size: 24px; 
        font-weight: 600; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
        color: #ffd700; /* Guld */
        
        /* Dessa två rader centrerar rubriken i det lediga utrymmet ovanför kortet */
        margin-top: auto;
        margin-bottom: auto;
    }

    /* Standard (Mobil): Smalt kort, max 500px */
    .game-card { 
        width: 100%; 
        max-width: 500px; 
        background: #1a1a1a; 
        padding: 0; 
        border-radius: 20px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        overflow: hidden; 
        display: flex; 
        flex-direction: column; 
        position: relative; /* Viktigt för absolut positionering inuti */
        
        /* Använder dvh men med en max-höjd för säkerhet */
        height: 80dvh; 
        max-height: 800px;
        
        transition: max-width 0.3s ease; 
    }
    
    /* FLIK-SYSTEM (TABS) */
    .tab-nav { display: flex; background: #222; border-bottom: 1px solid #333; flex-shrink: 0; }
    .tab-btn { 
        flex: 1; 
        padding: 15px; 
        background: transparent; 
        border: none; 
        color: #888; 
        font-size: 14px; /* Lite mindre font för att få plats med 3 knappar */
        font-weight: 600; 
        cursor: pointer; 
        border-bottom: 3px solid transparent; 
        transition: all 0.2s;
        border-radius: 0; 
        height: auto; 
        width: auto; 
        text-transform: uppercase;
    }
    .tab-btn.active { color: #ffd700; border-bottom: 3px solid #ffd700; background: #252525; }
    
    /* Tab Content */
    .tab-content { display: none; flex-grow: 1; position: relative; height: 100%; }
    .tab-content.active { display: flex; flex-direction: column; }
    #tab-map { padding: 15px; }

    /* STARTSIDA STYLING */
    #tab-home {
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 30px;
        background: radial-gradient(circle at center, #2a2a2a 0%, #1a1a1a 100%);
    }
    
    .welcome-title {
        font-family: 'MedievalSharp', cursive;
        font-size: 42px;
        color: #ffd700;
        margin-bottom: 20px;
        line-height: 1.2;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    
    .welcome-subtitle {
        font-size: 18px;
        color: #ddd;
        line-height: 1.5;
        max-width: 80%;
    }

    /* INNEHÅLLSKONTROLLER (Karta) */
    #controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #252525; padding: 10px 20px; border-radius: 12px; }
    
    button.floor-btn { padding: 0; font-size: 24px; cursor: pointer; border: none; border-radius: 8px; background: #444; color: #fff; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    button.floor-btn:active { background: #666; transform: scale(0.95); }
    
    #floorDisplay { display: flex; flex-direction: column; align-items: center; }
    #floorLabel { font-size: 10px; color: #888; text-transform: uppercase; }
    #floorNumber { font-size: 24px; font-weight: bold; color: #ffd700; }
    .map-container { position: relative; width: 100%; flex-grow: 1; min-height: 200px; }
    #map { width: 100%; height: 100%; border-radius: 12px; background: #222; z-index: 1; }
    
    /* LADDNINGSSYMBOL */
    .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; border: 5px solid rgba(255, 255, 255, 0.1); border-top: 5px solid #ffd700; border-radius: 50%; animation: spin 1s linear infinite; z-index: 1000; display: none; pointer-events: none; }
    @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    
    .leaflet-bar a { background-color: #333; color: #fff; border-bottom: 1px solid #444; }
    .leaflet-container { background: #222; }

    /* KOD-INPUT (Karta) */
    .code-section { margin-top: 10px; display: flex; gap: 10px; width: 100%; }
    #secretCode { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #333; color: white; font-size: 16px; outline: none; }
    #secretCode:focus { border-color: #ffd700; }
    #submitCode { 
        width: auto; 
        padding: 0 20px; 
        font-size: 16px; 
        background: #ffd700; 
        color: #000; 
        font-weight: bold; 
        border: none; 
        border-radius: 8px; 
        cursor: pointer;
    }
    #submitCode:active { background: #e5c100; }
    
    #messageArea { margin-top: 5px; min-height: 20px; font-size: 14px; color: #ffd700; text-align: center; font-weight: 500; }

    /* NOLLSTÄLLNINGSKNAPP */
    .reset-section { margin-top: 5px; text-align: center; border-top: 1px solid #333; padding-top: 10px; }
    #resetGame { background: transparent; color: #ff4444; border: 1px solid #ff4444; font-size: 14px; padding: 8px 16px; font-weight: normal; border-radius: 8px; cursor: pointer; }
    #resetGame:active { background: #ff4444; color: #fff; }

    /* ========================================= */
    /* VIDEO-ORAKEL STYLING */
    /* ========================================= */

    .video-oracle-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000; 
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* VIDEO WRAPPER */
    .video-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        aspect-ratio: 9 / 16; 
        max-width: 100%;
        max-height: 100%;
    }

    /* Standard Video (Mobil) */
    .video-mobile {
        display: block; 
        width: 100%; height: 100%;
        object-fit: cover; 
    }
    
    /* PC Video (Dold som standard) */
    .video-desktop {
        display: none; 
        width: 100%; height: 100%;
        object-fit: cover;
    }

    /* Textbubblan */
    .oracle-text-overlay {
        position: absolute;
        z-index: 10; 
        
        left: 15%;     
        top: 13%;      
        width: 64%;      
        height: 16.1%;   
        
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-family: 'MedievalSharp', cursive; 
        font-size: 20px; 
        
        font-weight: 900; 
        color: #000; 
        
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.6);
        
        padding: 2px;
        box-sizing: border-box;
        overflow: hidden; 
        line-height: 1.1;
        white-space: pre-line; 
    }

    .oracle-text-overlay.has-answered {
        top: 15%;
    }

    /* Frågerutan */
    .riddle-input-group { 
        position: absolute; 
        z-index: 100;
        bottom: 25px; 
        width: 90%; 
        left: 50%;
        transform: translateX(-50%);
        display: flex; 
        gap: 5px; 
        background: rgba(0, 0, 0, 0.6); 
        border-radius: 30px; 
        padding: 5px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
    }
    
    #riddleQuestion { 
        flex: 1; 
        padding: 12px 20px; 
        border: none; 
        background: transparent; 
        color: white; 
        outline: none; 
        font-size: 17px; 
    }
    
    #askRiddleBtn { 
        background: #ffd700;
        color: #000; 
        border: none; 
        padding: 10px 25px; 
        border-radius: 25px; 
        font-weight: bold; 
        cursor: pointer; 
        transition: transform 0.2s, background 0.2s;
        white-space: nowrap;
    }
    #askRiddleBtn:hover { background: #e5c100; }
    #askRiddleBtn:active { transform: scale(0.95); }
    #askRiddleBtn:disabled { opacity: 0.5; cursor: not-allowed; background: #666; }


    /* ========================================================== */
    /* --- DATOR-VERSION (PC) & STOR SKÄRM ---                    */
    /* ========================================================== */
    @media (min-width: 768px) {
        .game-card {
            max-width: 1000px; 
            height: 80vh;      
        }
        .video-wrapper {
            aspect-ratio: 16 / 9;
        }
        .video-mobile { display: none; }
        .video-desktop { display: block; }

        .oracle-text-overlay {
            left: 34.5%;      
            top: 7%;       
            width: 30%;     
            height: 30%;    
            font-size: clamp(16px, 2vw, 28px);
        }
        .oracle-text-overlay.has-answered {
            top: 7%; 
        }
        .riddle-input-group {
            bottom: 40px; 
            width: 60%;  
        }
    }

    /* --- SPECIAL: LITEN MOBIL (t.ex. iPhone SE) --- */
    @media (max-height: 700px) {
        .riddle-input-group {
            bottom: 80px; 
        }
        .game-card {
            height: 90vh;
        }
    }

</style>
</head>
<body>

<div class="main-wrapper">
    <h1>New Year Hunt</h1>
    <div class="game-card">
        
        <!-- FLIK-MENY (Uppdaterad) -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('home')">STARTSIDA</button>
            <button class="tab-btn" onclick="switchTab('map')">KARTA</button>
            <button class="tab-btn" onclick="switchTab('riddles')">ORAKLET</button>
        </div>

        <!-- FLIK 1: STARTSIDA (Ny) -->
        <div id="tab-home" class="tab-content active">
            <div class="welcome-title">Välkommen till skattjakten!</div>
            <div class="welcome-subtitle">Hitta skatten först för att vinna.</div>
        </div>

        <!-- FLIK 2: KARTA -->
        <div id="tab-map" class="tab-content">
            <div id="controls">
                <button id="floorDown" class="floor-btn" aria-label="Gå ner"> − </button>
                <div id="floorDisplay">
                    <span id="floorLabel">Våning</span>
                    <span id="floorNumber">0</span>
                </div>
                <button id="floorUp" class="floor-btn" aria-label="Gå upp"> + </button>
            </div>
            
            <div class="map-container">
                <div id="loader" class="loader"></div>
                <div id="map"></div>
            </div>

            <!-- Input för kod -->
            <div class="code-section">
                <input type="text" id="secretCode" placeholder="Skriv in föremålet här..." autocomplete="off">
                <button id="submitCode">Lås upp</button>
            </div>
            <div id="messageArea"></div>

            <!-- Nollställningsknapp -->
            <div class="reset-section">
                <button id="resetGame">Nollställ spelet</button>
            </div>
        </div>

        <!-- FLIK 3: ORAKLET -->
        <div id="tab-riddles" class="tab-content" style="padding:0;"> 
            
            <div class="video-oracle-container">
                
                <!-- WRAPPER: Denna box har låst aspect ratio -->
                <div class="video-wrapper">
                    <!-- MOBIL VIDEO (Vertikal) -->
                    <video class="video-mobile" autoplay loop muted playsinline>
                        <source src="oracle.mp4" type="video/mp4">
                    </video>

                    <!-- DATOR VIDEO (Horisontell) -->
                    <video class="video-desktop" autoplay loop muted playsinline>
                        <source src="oraclepc.mp4" type="video/mp4">
                    </video>

                    <!-- TEXTEN I PRATBUBBLAN -->
                    <div class="oracle-text-overlay" id="riddleAnswer">
                        Ställ mig Ja/Nej frågor för att lista ut 5 stycken hemliga föremål!
                    </div>
                </div> <!-- Slut på wrapper -->

            </div> <!-- Slut på video-oracle-container -->

            <!-- FRÅGERUTAN -->
            <div class="riddle-input-group">
                <input type="text" id="riddleQuestion" placeholder="Är det gjort av metall?" autocomplete="off">
                <button id="askRiddleBtn">Fråga</button>
            </div>
            
        </div>

    </div>
</div>

<script>
// ===========================
//  FLIK-HANTERING
// ===========================
function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

    document.getElementById(`tab-${tabName}`).classList.add('active');
    
    const buttons = document.querySelectorAll('.tab-btn');
    if(tabName === 'home') buttons[0].classList.add('active');
    if(tabName === 'map') buttons[1].classList.add('active');
    if(tabName === 'riddles') buttons[2].classList.add('active');

    if (tabName === 'map' && map) {
        setTimeout(() => {
            map.invalidateSize();
        }, 100); 
    }
}

// ===========================
//  INSTÄLLNINGAR
// ===========================

const startPixelX = 5579;
const startPixelY = 9840;
const startZoomLevel = 2; 

const fileExtension = ".png"; 
const imgWidth = 11199;
const imgHeight = 14999;

const floorPaths = [
    `tiles/0/{z}/{x}/{y}${fileExtension}`,
    `tiles/1/{z}/{x}/{y}${fileExtension}`,
    `tiles/2/{z}/{x}/{y}${fileExtension}`,
    `tiles/3/{z}/{x}/{y}${fileExtension}`
];

// ===========================
//  HEMLIGA OBJEKT
// ===========================
const secretLocations = [
    { 
        id: 1, 
        code: "RUBIKSKUB",  // UPPDATERAT TILL RUBIKSKUB
        floor: 0, 
        x: 2000, 
        y: 3000, 
        title: "Startpunkten", 
        msg: "Leta efter en lapp med nästa ledtråd.",
        aiDescription: "Det är en kub med sex sidor. Den har många färger (röd, blå, grön, gul, vit, orange). Det är ett mekaniskt pussel som man vrider på." 
    },
    { 
        id: 2, 
        code: "BOK",  
        floor: 1, 
        x: 5500, 
        y: 7500, 
        title: "Biblioteket",   
        msg: "Kunskap är makt.",
        aiDescription: "Den är gjord av papper. Den har en rygg men inga ben. Man läser i den. Den har sidor och ett omslag."
    },
    { 
        id: 3, 
        code: "KARTA", 
        floor: 2, 
        x: 8000, 
        y: 4000, 
        title: "Navigeringsrummet",     
        msg: "Nu hittar du bättre!",
        aiDescription: "Det är en ritning över ett område. Den visar vägar och landskap. Man använder den för att hitta rätt. Pirater har ofta en sådan med ett kryss på."
    },
    { 
        id: 4, 
        code: "FICKLAMPA",  
        floor: 0, 
        x: 5000, 
        y: 10060, 
        title: "Mörka källaren",    
        msg: "Varde ljus!",
        aiDescription: "Den är cylinderformad och man håller den i handen. Den lyser i mörkret. Den behöver batterier."
    },
    { 
        id: 5, 
        code: "SKATTKISTA",  
        floor: 2, 
        x: 5120, 
        y: 10245, 
        title: "Slutmålet",       
        msg: "Du hittade den stora skatten!",
        aiDescription: "Det är en stor låda, ofta av trä med metallbeslag. Den har ett lock som är välvt. Den innehåller guld och juveler."
    }
];

// Ladda data från minnet
let unlockedIds = JSON.parse(localStorage.getItem('unlockedLocations') || "[]");

// ===========================
//  SKAPA KARTA
// ===========================
const map = L.map("map", {
    crs: L.CRS.Simple, 
    minZoom: 2,        
    maxZoom: 6,        
    zoomControl: false, 
    attributionControl: false,
    maxBoundsViscosity: 0.85
});

L.control.zoom({ position: 'bottomright' }).addTo(map);

const markersLayer = L.featureGroup().addTo(map);

const southWest = map.unproject([0, imgHeight], map.getMaxZoom());
const northEast = map.unproject([imgWidth, 0], map.getMaxZoom());
const bounds = L.latLngBounds(southWest, northEast);

map.setMaxBounds(bounds);

const startCoords = map.unproject([startPixelX, startPixelY], map.getMaxZoom());
map.setView(startCoords, startZoomLevel);

let currentFloor = -1;
let currentLayer = null;
const floorNumDisplay = document.getElementById("floorNumber");
const loader = document.getElementById("loader");
const messageArea = document.getElementById("messageArea");

function setLoading(loading) {
    loader.style.display = loading ? 'block' : 'none';
}

const redCrossIcon = L.icon({
    iconUrl: 'data:image/svg+xml;charset=utf-8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="%23ff0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
    iconSize: [40, 40],   
    iconAnchor: [20, 20], 
    popupAnchor: [0, -20] 
});

function updateMarkers() {
    markersLayer.clearLayers(); 

    secretLocations.forEach(loc => {
        if (unlockedIds.includes(loc.id) && loc.floor === currentFloor) {
            const latLng = map.unproject([loc.x, loc.y], map.getMaxZoom());
            const marker = L.marker(latLng, { icon: redCrossIcon }).addTo(markersLayer);
            marker.bindPopup(`<b>${loc.title}</b><br>${loc.msg}`);
        }
    });
}

function checkCode() {
    const input = document.getElementById("secretCode");
    const code = input.value.trim().toUpperCase(); 
    
    // ÄNDRAT: Jämför med toUpperCase() på båda sidor för att vara säker
    const foundLocation = secretLocations.find(loc => loc.code.toUpperCase() === code);

    if (foundLocation) {
        if (!unlockedIds.includes(foundLocation.id)) {
            unlockedIds.push(foundLocation.id);
            localStorage.setItem('unlockedLocations', JSON.stringify(unlockedIds));
            
            messageArea.textContent = `✅ Plats upplåst: ${foundLocation.title} (Våning ${foundLocation.floor})`;
            messageArea.style.color = "#4caf50"; 
            
            if (currentFloor !== foundLocation.floor) {
                switchFloor(foundLocation.floor);
            } else {
                updateMarkers();
            }
            
            const latLng = map.unproject([foundLocation.x, foundLocation.y], map.getMaxZoom());
            
            map.flyTo(latLng, 5, {
                animate: true,
                duration: 2.5 
            });

        } else {
            messageArea.textContent = "⚠️ Den här platsen är redan upplåst.";
            messageArea.style.color = "#ffd700";
        }
        input.value = ""; 
    } else {
        messageArea.textContent = "❌ Felaktig kod.";
        messageArea.style.color = "#ff4444";
    }

    setTimeout(() => { messageArea.textContent = ""; }, 5000);
}

// ===========================
//  GEMINI KONFIGURATION
// ===========================

const workerUrl = "https://broken-field-c503.oekbring.workers.dev/"; 
const apiKey = ""; 

async function callGemini(userPrompt, systemPrompt = "") {
    if (apiKey && apiKey.length > 10) {
        return callGeminiDirect(userPrompt, systemPrompt);
    }
    if (workerUrl && workerUrl !== "DIN_CLOUDFLARE_WORKER_URL_HÄR") {
        return callGeminiWorker(userPrompt, systemPrompt);
    }
    return "⚠️ Konfiguration saknas! Fyll i 'workerUrl' eller 'apiKey' i koden.";
}

async function callGeminiWorker(userPrompt, systemPrompt) {
    const payload = {
        contents: [{ parts: [{ text: userPrompt }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] }
    };
    try {
        const response = await fetch(workerUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!response.ok) {
            const text = await response.text();
            throw new Error(`Serverfel ${response.status}: ${text.substring(0, 50)}...`);
        }
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        return data.candidates?.[0]?.content?.parts?.[0]?.text || "Inget svar...";
    } catch (error) {
        console.log("Worker connection error:", error);
        return `Kunde inte nå oraklet (Worker: ${error.message}). Kolla konsolen.`;
    }
}

async function callGeminiDirect(userPrompt, systemPrompt) {
    const payload = {
        contents: [{ parts: [{ text: userPrompt }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] }
    };
    const model = "gemini-2.5-flash-preview-09-2025";
    try {
        const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }
        );
        if (!response.ok) throw new Error(`Fel ${response.status}`);
        const data = await response.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text || "Inget svar...";
    } catch (error) {
        return `Kunde inte nå oraklet (API-fel: ${error.message}).`;
    }
}

async function handleRiddleQuestion() {
    const input = document.getElementById("riddleQuestion");
    const answerDisplay = document.getElementById("riddleAnswer");
    const btn = document.getElementById("askRiddleBtn");
    
    const question = input.value.trim();
    if (!question) return;

    const nextLocked = secretLocations.find(loc => !unlockedIds.includes(loc.id));
    
    if (!nextLocked) {
        answerDisplay.textContent = "Du är redan klar, gå och lägg dig.";
        return;
    }

    btn.disabled = true;
    answerDisplay.textContent = "..."; 

    const systemPrompt = `
    Du är ett urgammalt, lite vresigt och sarkastiskt Orakel i en skattjakt. 
    Spelaren försöker gissa vilket hemligt föremål jag tänker på.
    
    RÄTT SVAR (DET HEMLIGA FÖREMÅLET): "${nextLocked.code}"
    FAKTA OM FÖREMÅLET: "${nextLocked.aiDescription}"

    INSTRUKTIONER FÖR SVAREN:
    1. Om spelaren gissar RÄTT på föremålet (t.ex. "Är det en ${nextLocked.code}?" eller bara "${nextLocked.code}"), svara EXAKT: "Rätt svar!\n\nSkriv in "${nextLocked.code}" på kartan."
    2. Om frågan är en relevant Ja/Nej-fråga om föremålets egenskaper, svara ENDAST "Ja" eller "Nej" baserat på faktan.
    3. FÖR ALLT ANNAT (om du inte vet, om frågan är dum, irrelevant, inte en ja/nej-fråga): Ge ett sarkastiskt, hånfullt eller roligt svar på svenska. Håna spelaren lite för deras dåliga fråga. Håll svaret lagom kort (max 3 meningar).
    `;

    const response = await callGemini(question, systemPrompt);
    
    answerDisplay.classList.add('has-answered');

    let cleanResponse = response.trim();
    if (cleanResponse.length < 5 && cleanResponse.endsWith('.')) cleanResponse = cleanResponse.slice(0, -1);

    answerDisplay.textContent = cleanResponse;
    answerDisplay.style.color = "#000"; 

    if (cleanResponse.length < 5) { 
        answerDisplay.style.fontSize = "clamp(30px, 10vw, 45px)";
        answerDisplay.style.lineHeight = "1.2";
    } else if (cleanResponse.length < 30) { 
        answerDisplay.style.fontSize = "clamp(20px, 6vw, 30px)";
        answerDisplay.style.lineHeight = "1.2";
    } else if (cleanResponse.length < 180) { 
        answerDisplay.style.fontSize = "clamp(14px, 4vw, 20px)";
        answerDisplay.style.lineHeight = "1.1";
    } else { 
        answerDisplay.style.fontSize = "clamp(10px, 3vw, 14px)";
        answerDisplay.style.lineHeight = "1.0";
    }

    btn.disabled = false;
    input.value = "";
}

document.getElementById("askRiddleBtn").onclick = handleRiddleQuestion;
document.getElementById("riddleQuestion").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        handleRiddleQuestion();
    }
});

function resetGame() {
    if(confirm("Är du säker på att du vill nollställa alla framsteg?")) {
        unlockedIds = [];
        localStorage.removeItem('unlockedLocations');
        updateMarkers();
        messageArea.textContent = "🔄 Spelet är nollställt.";
        messageArea.style.color = "#fff";
        
        const answerDisplay = document.getElementById("riddleAnswer");
        answerDisplay.textContent = "Kom igen då, fråga nåt!";
        answerDisplay.classList.remove('has-answered');
        
        setTimeout(() => { messageArea.textContent = ""; }, 3000);
    }
}

function switchFloor(newFloor) {
    if (newFloor < 0 || newFloor >= floorPaths.length) return;
    if (newFloor === currentFloor) return; 

    setLoading(true);

    if (currentLayer) map.removeLayer(currentLayer);

    currentFloor = newFloor;
    localStorage.setItem('currentFloor', currentFloor);

    const newLayer = L.tileLayer(floorPaths[currentFloor], {
        minZoom: 2,
        maxZoom: 6,
        tileSize: 256,
        noWrap: true,
        tms: false,
        attribution: '',
        bounds: bounds
    });
    
    newLayer.on('load', function() { setLoading(false); });
    newLayer.addTo(map);
    currentLayer = newLayer; 

    markersLayer.bringToFront();
    updateMarkers();

    setTimeout(() => setLoading(false), 5000);

    floorNumDisplay.style.opacity = 0;
    setTimeout(() => {
        floorNumDisplay.textContent = currentFloor;
        floorNumDisplay.style.opacity = 1;
    }, 150);
}

document.getElementById("floorUp").onclick = () => switchFloor(currentFloor + 1);
document.getElementById("floorDown").onclick = () => switchFloor(currentFloor - 1);
document.getElementById("submitCode").onclick = checkCode;
document.getElementById("resetGame").onclick = resetGame;

document.getElementById("secretCode").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        checkCode();
    }
});

switchFloor(3);

window.addEventListener('resize', () => {
    map.invalidateSize();
});

</script>
