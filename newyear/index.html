<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>New Year Treasure Hunt</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Ersätt med din ikon -->
<link rel="icon" type="image/x-icon" href="newyearico.ico">

<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Huvudcontainer för att centrera allt och begränsa bredden */
    .main-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 10px;
        box-sizing: border-box;
    }

    h1 {
        text-align: center;
        margin-bottom: 15px;
        font-size: 24px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* "Kortet" som håller spelet */
    .game-card {
        width: 100%;
        max-width: 500px; /* Begränsar bredden på desktop så det blir en "ruta" */
        background: #1a1a1a;
        padding: 15px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        background: #252525;
        padding: 10px 20px;
        border-radius: 12px;
    }

    button {
        padding: 0;
        font-size: 24px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background: #444;
        color: #fff;
        width: 44px; /* Större touch-yta */
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
    }

    button:active {
        background: #666;
        transform: scale(0.95);
    }

    #floorDisplay {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #floorLabel {
        font-size: 10px;
        color: #888;
        text-transform: uppercase;
    }

    #floorNumber {
        font-size: 24px;
        font-weight: bold;
        color: #ffd700; /* Guld-färg för nyårskänsla */
    }

    #map {
        width: 100%;
        height: 60vh; /* 60% av skärmhöjden, passar bra på mobil */
        max-height: 500px; /* Inte för hög på desktop */
        min-height: 300px;
        border-radius: 12px;
        background: #222; /* Lite ljusare bakgrund ifall man laddar sega bilder */
        z-index: 1;
    }

    /* Fix för Leaflet kontroller så de ser snygga ut i mörkt tema */
    .leaflet-bar a {
        background-color: #333;
        color: #fff;
        border-bottom: 1px solid #444;
    }
    .leaflet-bar a:hover {
        background-color: #444;
    }
    .leaflet-container {
        background: #222;
    }
</style>
</head>
<body>

<div class="main-wrapper">
    <h1>New Year Hunt</h1>

    <div class="game-card">
        <div id="controls">
            <button id="floorDown" aria-label="Gå ner"> − </button>
            <div id="floorDisplay">
                <span id="floorLabel">Våning</span>
                <span id="floorNumber">0</span>
            </div>
            <button id="floorUp" aria-label="Gå upp"> + </button>
        </div>

        <div id="map"></div>
    </div>
</div>

<script>
// ===========================
//  INSTÄLLNINGAR
// ===========================

// OBS: Se till att dessa bilder finns, annars visas inget i rutan
const floorImages = [
    "test1.jpg",   // Våning 0
    "vaning1.2.jpg", // Våning 1
    "test1.jpg",   // Våning 2 (Placeholder)
    "test2.jpg"    // Våning 3
];

const imgWidth = 11199;
const imgHeight = 14999;
const bounds = [[0,0], [imgHeight, imgWidth]];

// ===========================
//  SKAPA KARTA
// ===========================
const map = L.map("map", {
    crs: L.CRS.Simple,
    minZoom: -3, 
    maxZoom: 2,
    zoomControl: false, 
    attributionControl: false,
    // --- NYA RADER FÖR ATT LÅSA VYN ---
    maxBounds: bounds,       // Sätter en hård gräns för hur långt man kan panorera
    maxBoundsViscosity: 0.8  // 1.0 gör kanten helt stum (ingen "studs")
});

// Lägg till zoom-knappar nere till höger (bättre för tummen på mobil)
L.control.zoom({
    position: 'bottomright'
}).addTo(map);

map.fitBounds(bounds);

// Skapa overlay-lager
const floorLayers = floorImages.map(img => 
    L.imageOverlay(img, bounds)
);

// Visa våning 0
let currentFloor = 1;
floorLayers[currentFloor].addTo(map);

const floorNumDisplay = document.getElementById("floorNumber");
floorNumDisplay.textContent = currentFloor;

// ===========================
//  FUNKTION FÖR BYT VÅNING
// ===========================
function switchFloor(newFloor) {
    // Kontrollera gränser (dynamiskt baserat på array-längd)
    if (newFloor < 0 || newFloor >= floorImages.length) return;

    map.removeLayer(floorLayers[currentFloor]);
    currentFloor = newFloor;
    floorLayers[currentFloor].addTo(map);
    
    // Animera texten lite vid byte
    floorNumDisplay.style.opacity = 0;
    setTimeout(() => {
        floorNumDisplay.textContent = currentFloor;
        floorNumDisplay.style.opacity = 1;
    }, 150);

    // Centrera kartan igen vid våningsbyte (valfritt)
    // map.flyToBounds(bounds); 
}

// ===========================
//  KNAPPAR
// ===========================
document.getElementById("floorUp").onclick = () => {
    switchFloor(currentFloor + 1);
};

document.getElementById("floorDown").onclick = () => {
    switchFloor(currentFloor - 1);
};

// Se till att kartan ritas om korrekt om man vrider på mobilen
window.addEventListener('resize', () => {
    map.invalidateSize();
});

</script>

</body>
</html>
