<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>New Year Treasure Hunt</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="icon" type="image/x-icon" href="newyearico.ico">

<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .main-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 10px;
        box-sizing: border-box;
    }

    h1 {
        text-align: center;
        margin-bottom: 15px;
        font-size: 24px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .game-card {
        width: 100%;
        max-width: 500px;
        background: #1a1a1a;
        padding: 15px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        background: #252525;
        padding: 10px 20px;
        border-radius: 12px;
    }

    button {
        padding: 0;
        font-size: 24px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background: #444;
        color: #fff;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
    }

    button:active {
        background: #666;
        transform: scale(0.95);
    }

    #floorDisplay {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #floorLabel {
        font-size: 10px;
        color: #888;
        text-transform: uppercase;
    }

    #floorNumber {
        font-size: 24px;
        font-weight: bold;
        color: #ffd700;
    }

    /* Container för att positionera kartan och laddaren */
    .map-container {
        position: relative;
        width: 100%;
        height: 60vh;
        max-height: 500px;
        min-height: 300px;
    }

    #map {
        width: 100%;
        height: 100%; /* Fyller map-container */
        border-radius: 12px;
        background: #222;
        z-index: 1;
    }

    /* --- LADDNINGSSYMBOL --- */
    .loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.1); /* Svag ring */
        border-top: 5px solid #ffd700; /* Snurrande del (Guld) */
        border-radius: 50%;
        animation: spin 1s linear infinite;
        z-index: 1000; /* Ligger ovanpå kartan */
        display: none; /* Dold som standard */
        pointer-events: none; /* Klick går igenom */
    }

    @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .leaflet-bar a {
        background-color: #333;
        color: #fff;
        border-bottom: 1px solid #444;
    }
    .leaflet-bar a:hover {
        background-color: #444;
    }
    .leaflet-container {
        background: #222;
    }
</style>
</head>
<body>

<div class="main-wrapper">
    <h1>New Year Hunt</h1>

    <div class="game-card">
        <div id="controls">
            <button id="floorDown" aria-label="Gå ner"> − </button>
            <div id="floorDisplay">
                <span id="floorLabel">Våning</span>
                <span id="floorNumber">0</span>
            </div>
            <button id="floorUp" aria-label="Gå upp"> + </button>
        </div>

        <div class="map-container">
            <!-- Laddningssymbolen -->
            <div id="loader" class="loader"></div>
            <div id="map"></div>
        </div>
    </div>
</div>

<script>
// ===========================
//  INSTÄLLNINGAR
// ===========================

const floorImages = [
    "test1.jpg",   // Våning 0
    "vaning1.2.jpg", // Våning 1
    "test1.jpg",   // Våning 2
    "vaning3.jpg"    // Våning 3
];

const imgWidth = 11199;
const imgHeight = 14999;
const bounds = [[0,0], [imgHeight, imgWidth]];

// ===========================
//  SKAPA KARTA
// ===========================
const map = L.map("map", {
    crs: L.CRS.Simple,
    minZoom: -3, 
    maxZoom: 2,
    zoomControl: false, 
    attributionControl: false,
    maxBounds: bounds,
    maxBoundsViscosity: 0.8
});

L.control.zoom({ position: 'bottomright' }).addTo(map);
map.fitBounds(bounds);

// Förbered lager
const floorLayers = floorImages.map(img => 
    L.imageOverlay(img, bounds)
);

let currentFloor = -1; // Startar på -1 för att tvinga en uppdatering första gången
const floorNumDisplay = document.getElementById("floorNumber");
const loader = document.getElementById("loader");

// ===========================
//  FUNKTION FÖR ATT VISA LADDARE
// ===========================
function setLoading(loading) {
    loader.style.display = loading ? 'block' : 'none';
}

// ===========================
//  FUNKTION FÖR BYT VÅNING
// ===========================
function switchFloor(newFloor) {
    if (newFloor < 0 || newFloor >= floorImages.length) return;
    if (newFloor === currentFloor) return; // Gör inget om vi redan är på rätt våning

    // Visa laddare direkt
    setLoading(true);

    // Ta bort gammalt lager om det finns
    if (currentFloor !== -1 && floorLayers[currentFloor]) {
        map.removeLayer(floorLayers[currentFloor]);
    }

    currentFloor = newFloor;
    const nextLayer = floorLayers[currentFloor];

    // Lyssna på när bilden är färdigladdad
    // Vi använder .once() så vi slipper dubbla event-lyssnare i framtiden
    nextLayer.once('load', function() {
        setLoading(false);
    });

    nextLayer.addTo(map);
    
    // Om bilden är cachad och laddas omedelbart kan 'load' ibland missas i vissa webbläsare
    // (Leaflet är oftast bra på detta, men som säkerhetsåtgärd kan man sätta en timeout för att dölja laddaren om det hänger sig)
    setTimeout(() => setLoading(false), 5000); // Säkerhetsstopp efter 5 sekunder

    // Uppdatera text
    floorNumDisplay.style.opacity = 0;
    setTimeout(() => {
        floorNumDisplay.textContent = currentFloor;
        floorNumDisplay.style.opacity = 1;
    }, 150);
}

// ===========================
//  KNAPPAR
// ===========================
document.getElementById("floorUp").onclick = () => {
    switchFloor(currentFloor + 1);
};

document.getElementById("floorDown").onclick = () => {
    switchFloor(currentFloor - 1);
};

// Starta på våning 1
switchFloor(1);

window.addEventListener('resize', () => {
    map.invalidateSize();
});

</script>

</body>
</html>
