<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Midsommarjakten 2026</title>
    <link rel="icon" href="midsummer.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://use.typekit.net/gql3yae.css">
    <style>
        :root {
            --col-1: #EDE5BE;
            --col-2: #C9C3A1;
            --col-3: #A19B81;
            --col-4: #787460;
            --col-5: #4F4C3F;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--col-1);
            color: var(--col-5);
            font-family: antiquarian, sans-serif;
            font-variant-numeric: lining-nums;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: pan-x pan-y;
        }

        #app-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .map-background {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            z-index: 0;
            opacity: 0.35;
            pointer-events: none;
            transform: perspective(1000px) rotateX(55deg) rotateZ(-20deg);
            transform-origin: center center;
        }

        .map-background svg {
            width: 100%;
            height: 100%;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            padding: 2vh 15px;
            overflow: hidden;
        }

        .screen.active {
            display: flex;
        }

        .anim-height {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            width: 100%;
            justify-items: center;
        }
        .anim-height.open {
            grid-template-rows: 1fr;
        }
        .anim-height > .inner {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .header-container {
            text-align: center;
            margin-bottom: 1.5vh; 
            background: rgba(237, 229, 190, 0.7);
            padding: 1.5vh 20px; 
            border-radius: 16px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            flex-shrink: 0;
            transition: all 0.8s ease;
            max-width: 90vw;
        }

        h1 {
            font-size: clamp(1.6rem, 5vw, 2rem); 
            font-family: antiquarian-scribe, sans-serif;
            font-weight: 700;
            color: var(--col-5);
            letter-spacing: -1px;
            margin-bottom: 2px; 
            text-transform: uppercase;
        }

        .title-crossfade {
            display: grid;
            grid-template-areas: "title";
            justify-items: center;
            align-items: center;
        }
        
        .title-crossfade span {
            grid-area: title;
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            text-align: center;
        }

        #title-w {
            font-size: clamp(1.6rem, 5.5vw, 2.2rem);
            line-height: 1.2;
            opacity: 1;
            transform: translateY(0);
        }

        #title-s {
            font-size: inherit;
            opacity: 0;
            transform: translateY(15px);
        }

        #start-screen:not(.view-welcome) #title-w {
            opacity: 0;
            transform: translateY(-15px);
        }
        #start-screen:not(.view-welcome) #title-s {
            opacity: 1;
            transform: translateY(0);
        }

        .num {
            font-size: 1.2em;
        }

        .subtitle {
            font-size: clamp(0.85rem, 3vw, 1rem);
            color: var(--col-4);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 1vh;
        }

        .team-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1vh; 
            width: 100%;
            max-width: 400px;
            padding-top: 1.5vh;
        }

        .team-btn {
            background-color: var(--col-1);
            border: 2px solid var(--col-3);
            border-radius: 14px;
            padding: 1.5vh 15px; 
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(79, 76, 63, 0.1);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            font-family: antiquarian, sans-serif;
        }

        .team-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background-color: var(--col-5);
        }

        .team-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 8px rgba(79, 76, 63, 0.1);
            background-color: var(--col-2);
        }

        .team-name {
            display: block;
            font-size: 1.6rem; 
            font-family: antiquarian-scribe, sans-serif;
            font-weight: 700;
            color: var(--col-5);
            margin-bottom: 4px; 
        }

        .team-members {
            display: block;
            font-size: clamp(0.85rem, 3vw, 1rem);
            font-family: antiquarian, sans-serif;
            color: var(--col-4);
            line-height: 1.3;
            font-weight: 500;
        }
        
        #compass-container {
            position: relative;
            width: 60vmin; 
            height: 60vmin;
            max-width: 250px; 
            max-height: 250px;
            margin: 2vh 0; 
            flex-shrink: 0;
            border-radius: 50%;
            background-color: var(--col-1);
            box-shadow: 
                8px 8px 16px rgba(120, 116, 96, 0.2), 
                -8px -8px 16px rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* För att hålla zontimern inuti cirkeln */
        }

        #arrow {
            width: 90%;
            height: 90%;
            will-change: transform;
            position: absolute;
        }
        
        .crosshair {
            position: absolute;
            width: 16px;
            height: 16px;
            pointer-events: none; 
            z-index: 2;
        }

        .is-level .crosshair {
            opacity: 0 !important;
        }
        
        .crosshair-fixed {
            transition: opacity 0.3s ease;
        }
        .crosshair-fixed::before, .crosshair-fixed::after {
            content: '';
            position: absolute;
            background-color: var(--col-4);
            opacity: 0.4; 
        }
        .crosshair-fixed::before { top: 7.5px; left: 0; width: 16px; height: 1px; }
        .crosshair-fixed::after { top: 0; left: 7.5px; width: 1px; height: 16px; }

        .crosshair-dynamic {
            transition: transform 0.1s linear, opacity 0.3s ease;
            will-change: transform;
        }
        .crosshair-dynamic::before, .crosshair-dynamic::after {
            content: '';
            position: absolute;
            background-color: var(--col-5);
            opacity: 0.6; 
        }
        .crosshair-dynamic::before { top: 7.5px; left: 0; width: 16px; height: 1px; }
        .crosshair-dynamic::after { top: 0; left: 7.5px; width: 1px; height: 16px; }

        /* ZON-TIMER OVERLAY OVANPÅ KOMPASSEN */
        #proximity-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(237, 229, 190, 0.95);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .in-zone #proximity-overlay {
            opacity: 1;
        }

        .data-text {
            font-size: clamp(1.8rem, 7vw, 2.4rem);
            font-family: antiquarian-scribe, sans-serif;
            font-weight: 800;
            margin: 0px 0 0.5vh 0; 
            color: var(--col-5);
            letter-spacing: -1px;
        }

        .label {
            font-size: 0.75rem;
            color: var(--col-4);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-top: 0.5vh;
        }

        #status {
            font-size: 0.8rem;
            color: #d9534f;
            margin-top: 1vh;
            font-weight: 600;
            height: 1.2em; 
        }

        .btn-controls {
            display: flex;
            gap: 10px;
            margin-top: 1.5vh; 
            flex-shrink: 0;
        }

        .btn-back, .btn-secondary {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-family: antiquarian, sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-back {
            background: var(--col-4);
            color: var(--col-1);
            border: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--col-5);
            border: 2px solid var(--col-4);
        }

        /* SUCCESS SCREEN */
        .story-text {
            font-size: clamp(1rem, 4vw, 1.2rem);
            line-height: 1.5;
            color: var(--col-5);
            margin: 2vh 0;
            font-weight: 500;
        }

    </style>
</head>
<body>

<div id="app-wrapper">

    <!-- 3D BAKGRUND -->
    <div class="map-background">
        <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
            <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
                <path d="M 100 0 L 0 0 0 100" fill="none" stroke="var(--col-2)" stroke-width="1"/>
            </pattern>
            <rect width="100%" height="100%" fill="url(#grid)" />
            <g fill="none" stroke="var(--col-4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M-100,200 C150,150 250,300 500,250 C700,210 800,400 1100,350" />
                <path d="M-100,300 C200,250 300,400 550,350 C750,310 850,500 1100,450" />
                <path d="M100,100 C300,50 400,200 650,150 C850,110 950,300 1200,250" opacity="0.5"/>
                <path d="M-50,600 C200,500 400,700 700,550 C900,450 950,700 1100,600" />
                <path d="M-50,700 C250,600 450,800 750,650 C950,550 1000,800 1100,700" />
                <path d="M700,800 C650,820 620,870 650,920 C680,970 750,950 780,900 C810,850 750,780 700,800 Z" />
                <path d="M710,830 C680,840 660,870 680,900 C700,930 740,920 750,890 C760,860 740,820 710,830 Z" opacity="0.6"/>
                <path d="M705,860 L725,880 M725,860 L705,880" stroke="var(--col-5)" stroke-width="4" />
            </g>
        </svg>
    </div>

    <!-- STARTSKÄRM -->
    <div id="start-screen" class="screen active view-welcome">
        <div class="header-container">
            <h1 class="title-crossfade">
                <span id="title-w">Välkommen till den årliga<br>midsommarjakten</span>
                <span id="title-s">Midsommarjakten <span class="num">2026</span></span>
            </h1>
            <div class="anim-height" id="subtitle-wrapper">
                <div class="inner">
                    <div class="subtitle">Välj ditt lag</div>
                </div>
            </div>
        </div>

        <div class="anim-height open" id="welcome-btn-wrapper">
            <div class="inner">
                <button class="team-btn" onclick="beginHunt()" style="margin-top: 3vh; font-family: antiquarian-scribe, sans-serif; font-size: clamp(1.8rem, 6vw, 2.2rem); padding: 1.5vh 30px; border-width: 3px;">
                    Börja leta
                </button>
            </div>
        </div>

        <div class="anim-height" id="team-grid-wrapper">
            <div class="inner">
                <div class="team-grid">
                    <button class="team-btn" onclick="selectTeam('Lag Röd')">
                        <span class="team-name">Lag Röd</span>
                        <span class="team-members">Lukas, Adam, Mira/Malou, Emma</span>
                    </button>
                    <button class="team-btn" onclick="selectTeam('Lag Blå')">
                        <span class="team-name">Lag Blå</span>
                        <span class="team-members">Olle, Malte, Wanja, Signe</span>
                    </button>
                    <button class="team-btn" onclick="selectTeam('Lag Grön')">
                        <span class="team-name">Lag Grön</span>
                        <span class="team-members">Thelma, Nathalie, Malou/Mira</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SPELSKÄRM (Kompass) -->
    <div id="app-screen" class="screen">
        <div class="header-container">
            <h1 id="active-team-display">Inget lag valt</h1>
            <div class="subtitle">Etapp <span class="num" id="stage-display">1</span> / 4</div>
        </div>

        <div class="label">Avstånd till mål</div>
        <div id="distance" class="data-text">-- m</div>
        
        <div id="compass-container">
            <!-- Kompassnål -->
            <svg id="arrow" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" fill="none" stroke="var(--col-2)" stroke-width="2"/>
                <circle cx="50" cy="50" r="42" fill="none" stroke="var(--col-3)" stroke-width="1" stroke-dasharray="4 4"/>
                <polygon points="50,12 58,50 50,50" fill="var(--col-5)" />
                <polygon points="50,12 42,50 50,50" fill="var(--col-4)" />
                <polygon points="50,88 58,50 50,50" fill="var(--col-3)" />
                <polygon points="50,88 42,50 50,50" fill="var(--col-2)" />
            </svg>
            
            <!-- Lutningskors -->
            <div class="crosshair crosshair-fixed"></div>
            <div class="crosshair crosshair-dynamic" id="tilt-cross"></div>

            <!-- PROXIMITY OVERLAY (Visas inom 3 meter) -->
            <div id="proximity-overlay">
                <div class="label">Stanna här i</div>
                <div id="zone-timer" class="data-text num" style="font-size: 4rem;">30</div>
                <div class="label">sekunder</div>
            </div>
        </div>

        <div class="label">Riktning</div>
        <div id="heading" class="data-text">--°</div>
        
        <div id="status"></div>
        
        <div class="btn-controls">
            <button class="btn-back" onclick="goBack()">Avbryt</button>
            <button class="btn-secondary" onclick="resetCompass()">Återställ kompass</button>
        </div>
    </div>

    <!-- ETAPP AVSLUTAD / SUCCESS SCREEN -->
    <div id="success-screen" class="screen">
        <div class="header-container">
            <h1>Bra jobbat!</h1>
            <div class="subtitle" id="success-subtitle">Etapp avklarad</div>
        </div>
        
        <div class="header-container" style="background: var(--col-1); border: 2px solid var(--col-3);">
            <div class="story-text" id="success-text">
                Här kommer ledtråden till nästa plats.
            </div>
        </div>
        
        <button class="team-btn" id="next-stage-btn" onclick="startNextStage()" style="margin-top: 2vh; border-width: 3px;">
            <span class="team-name" style="font-size: 1.4rem;">Starta nästa etapp</span>
        </button>
    </div>

    <script>
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

        // --- SPELDATA (4 Etapper) ---
        const gameStages = [
            {
                title: "Etapp 1",
                successText: "Snyggt jobbat! Ni har nått första platsen. För att hitta nästa punkt, gå mot den stora eken och följ kompassen noggrant.",
                coords: {
                    'Lag Röd':  { lat: 59.3293, lng: 18.0686 },
                    'Lag Blå':  { lat: 59.3300, lng: 18.0700 },
                    'Lag Grön': { lat: 59.3280, lng: 18.0650 }
                }
            },
            {
                title: "Etapp 2",
                successText: "Hälften avklarat på land! Fortsätt längs stigen tills ni ser klipporna. Lita på kompassen.",
                coords: {
                    'Lag Röd':  { lat: 59.3294, lng: 18.0687 },
                    'Lag Blå':  { lat: 59.3301, lng: 18.0701 },
                    'Lag Grön': { lat: 59.3281, lng: 18.0651 }
                }
            },
            {
                title: "Etapp 3",
                successText: "Sista ledtråden på land! Nästa och sista punkten ligger ute i vattnet. Bege er mot vattnet och leta efter en boj som guppar precis vid ytan. Skatten ligger på bottnen!",
                coords: {
                    'Lag Röd':  { lat: 59.3295, lng: 18.0688 },
                    'Lag Blå':  { lat: 59.3302, lng: 18.0702 },
                    'Lag Grön': { lat: 59.3282, lng: 18.0652 }
                }
            },
            {
                title: "Etapp 4 (Finalen)",
                successText: "GRATTIS! Ni har hittat midsommarskatten! Hoppas ni inte blev för blöta.",
                coords: {
                    'Lag Röd':  { lat: 59.3299, lng: 18.0699 },
                    'Lag Blå':  { lat: 59.3299, lng: 18.0699 },
                    'Lag Grön': { lat: 59.3299, lng: 18.0699 }
                }
            }
        ];

        // --- STATE & VARIABLER ---
        let currentTeam = null;
        let currentStageIndex = 0;

        let currentTargetLat = null;
        let currentTargetLng = null;
        let currentLat = null;
        let currentLng = null;
        let currentHeading = 0;
        
        let currentBeta = 0;
        let currentGamma = 0;
        
        let bearingToTarget = 0;
        let targetVisualRotation = 0;
        let currentVisualRotation = 0;
        
        let watchId = null;
        let isTracking = false;
        let animationFrameId = null;

        let inZone = false;
        let zoneInterval = null;
        let timeLeft = 30;

        const startScreen = document.getElementById('start-screen');
        const appScreen = document.getElementById('app-screen');
        const successScreen = document.getElementById('success-screen');
        
        const activeTeamDisplay = document.getElementById('active-team-display');
        const stageDisplay = document.getElementById('stage-display');
        const distanceEl = document.getElementById('distance');
        const arrowEl = document.getElementById('arrow');
        const headingEl = document.getElementById('heading');
        const statusEl = document.getElementById('status');
        const tiltCrossEl = document.getElementById('tilt-cross');
        const compassContainer = document.getElementById('compass-container');
        const zoneTimerEl = document.getElementById('zone-timer');

        // --- LOCAL STORAGE LOGIK ---
        function checkSavedState() {
            const savedTeam = localStorage.getItem('midsommarTeam');
            const savedStage = localStorage.getItem('midsommarStage');
            
            if (savedTeam) {
                currentTeam = savedTeam;
                currentStageIndex = savedStage ? parseInt(savedStage) : 0;

                document.getElementById('start-screen').classList.remove('view-welcome');
                document.getElementById('subtitle-wrapper').style.display = 'none';
                document.getElementById('team-grid-wrapper').style.display = 'none';
                
                const welcomeBtnWrapper = document.getElementById('welcome-btn-wrapper');
                welcomeBtnWrapper.classList.add('open');
                
                let btnText = currentStageIndex >= gameStages.length ? "Visa Resultat" : "Återuppta jakten";

                welcomeBtnWrapper.innerHTML = `
                    <div class="inner">
                        <div class="subtitle" style="margin-bottom: 1vh; margin-top: 2vh;">Ditt lag: ${savedTeam}</div>
                        <div class="subtitle" style="font-size: 0.75rem;">(Etapp ${Math.min(currentStageIndex + 1, 4)} av 4)</div>
                        <button class="team-btn" onclick="startTracking()" style="margin-top: 1vh; font-family: antiquarian-scribe, sans-serif; font-size: clamp(1.4rem, 5vw, 1.8rem); padding: 1.5vh 30px; border-width: 3px;">
                            ${btnText}
                        </button>
                        <button class="btn-secondary" onclick="devResetTeam()" style="margin-top: 4vh; border: none; opacity: 0.5; font-size: 0.8rem;">Dev: Återställ helt</button>
                    </div>
                `;
            }
        }
        
        function devResetTeam() {
            localStorage.removeItem('midsommarTeam');
            localStorage.removeItem('midsommarStage');
            location.reload();
        }

        checkSavedState();

        function beginHunt() {
            document.getElementById('start-screen').classList.remove('view-welcome');
            document.getElementById('welcome-btn-wrapper').classList.remove('open');
            document.getElementById('subtitle-wrapper').classList.add('open');
            document.getElementById('team-grid-wrapper').classList.add('open');
        }

        async function selectTeam(teamName) {
            currentTeam = teamName;
            currentStageIndex = 0;
            localStorage.setItem('midsommarTeam', currentTeam);
            localStorage.setItem('midsommarStage', currentStageIndex);
            
            startTracking();
        }

        function loadStageData() {
            if (currentStageIndex >= gameStages.length) {
                showSuccessScreen(true);
                return false;
            }
            const stage = gameStages[currentStageIndex];
            currentTargetLat = stage.coords[currentTeam].lat;
            currentTargetLng = stage.coords[currentTeam].lng;
            
            activeTeamDisplay.innerText = currentTeam;
            stageDisplay.innerText = currentStageIndex + 1;
            return true;
        }

        function toRad(deg) { return deg * Math.PI / 180; }
        function toDeg(rad) { return rad * 180 / Math.PI; }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        function calculateBearing(lat1, lng1, lat2, lng2) {
            const dLon = toRad(lng2 - lng1);
            const y = Math.sin(dLon) * Math.cos(toRad(lat2));
            const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                      Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
            let brng = toDeg(Math.atan2(y, x));
            return (brng + 360) % 360;
        }

        function updateLogic() {
            if (currentLat === null || currentLng === null || currentTargetLat === null) return;

            const dist = calculateDistance(currentLat, currentLng, currentTargetLat, currentTargetLng);
            bearingToTarget = calculateBearing(currentLat, currentLng, currentTargetLat, currentTargetLng);

            if (dist <= 3) {
                distanceEl.innerHTML = `<span class="num">0</span> m`;
                if (!inZone) {
                    inZone = true;
                    compassContainer.classList.add('in-zone');
                    startZoneTimer();
                }
            } else {
                distanceEl.innerHTML = `<span class="num">${dist}</span> m`;
                if (inZone) {
                    inZone = false;
                    compassContainer.classList.remove('in-zone');
                    stopZoneTimer();
                }
            }

            headingEl.innerHTML = `<span class="num">${Math.round(currentHeading)}</span>°`;

            let rawTarget = bearingToTarget - currentHeading;
            let diff = (rawTarget - targetVisualRotation) % 360;
            if (diff < -180) diff += 360;
            if (diff > 180) diff -= 360;
            
            targetVisualRotation += diff;
            
            let maxOffset = 40; 
            let offsetX = Math.max(-maxOffset, Math.min(maxOffset, currentGamma));
            let offsetY = Math.max(-maxOffset, Math.min(maxOffset, currentBeta));
            
            tiltCrossEl.style.transform = `translate(${offsetX}px, ${offsetY}px)`;

            if (Math.abs(currentBeta) < 2 && Math.abs(currentGamma) < 2) {
                compassContainer.classList.add('is-level');
            } else {
                compassContainer.classList.remove('is-level');
            }
        }

        function startZoneTimer() {
            timeLeft = 30;
            zoneTimerEl.innerText = timeLeft;
            clearInterval(zoneInterval);
            
            zoneInterval = setInterval(() => {
                timeLeft--;
                zoneTimerEl.innerText = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(zoneInterval);
                    inZone = false;
                    compassContainer.classList.remove('in-zone');
                    stageCompleted();
                }
            }, 1000);
        }

        function stopZoneTimer() {
            clearInterval(zoneInterval);
            timeLeft = 30;
            zoneTimerEl.innerText = timeLeft;
        }

        function stageCompleted() {
            stopTracking();
            showSuccessScreen();
        }

        function showSuccessScreen(alreadyFinished = false) {
            appScreen.classList.remove('active');
            startScreen.classList.remove('active');
            successScreen.classList.add('active');
            
            const stageTextEl = document.getElementById('success-text');
            const stageSubtitleEl = document.getElementById('success-subtitle');
            const nextBtn = document.getElementById('next-stage-btn');

            if (alreadyFinished || currentStageIndex >= gameStages.length - 1) {
                stageSubtitleEl.innerText = "Skatten är funnen!";
                stageTextEl.innerText = gameStages[3].successText;
                nextBtn.style.display = 'none';
                if (!alreadyFinished) {
                    currentStageIndex = 4;
                    localStorage.setItem('midsommarStage', currentStageIndex);
                }
            } else {
                stageSubtitleEl.innerText = `Etapp ${currentStageIndex + 1} avklarad`;
                stageTextEl.innerText = gameStages[currentStageIndex].successText;
                nextBtn.style.display = 'block';
                
                currentStageIndex++;
                localStorage.setItem('midsommarStage', currentStageIndex);
            }
        }

        function startNextStage() {
            successScreen.classList.remove('active');
            startTracking();
        }

        function renderFrame() {
            const smoothingFactor = 0.2; 
            currentVisualRotation += (targetVisualRotation - currentVisualRotation) * smoothingFactor;
            arrowEl.style.transform = `rotate(${currentVisualRotation}deg)`;
            
            if(isTracking) {
                animationFrameId = requestAnimationFrame(renderFrame);
            }
        }

        function handleOrientation(event) {
            if (event.webkitCompassHeading) {
                currentHeading = event.webkitCompassHeading;
            } else if (event.alpha !== null) {
                currentHeading = 360 - event.alpha;
            }
            if (event.beta !== null && event.gamma !== null) {
                currentBeta = event.beta;
                currentGamma = event.gamma;
            }
            updateLogic();
        }

        function resetCompass() {
            window.removeEventListener('deviceorientation', handleOrientation);
            currentHeading = 0; targetVisualRotation = 0; currentVisualRotation = 0;
            arrowEl.style.transform = `rotate(0deg)`;
            tiltCrossEl.style.transform = `translate(0px, 0px)`;
            setTimeout(() => { window.addEventListener('deviceorientation', handleOrientation); }, 100);
        }

        async function startTracking() {
            if (!loadStageData()) return;

            statusEl.innerText = "";
            checkSavedState();
            
            // 1. Fråga om kompass-behörighet (Krävs på iOS 13+)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        statusEl.innerText = "Kompass nekad. Godkänn i inställningar och starta om.";
                        return;
                    }
                } catch (error) {
                    statusEl.innerText = "Kunde inte begära kompass.";
                    return;
                }
            }

            // Byt UI
            startScreen.classList.remove('active');
            successScreen.classList.remove('active');
            appScreen.classList.add('active');

            isTracking = true;
            animationFrameId = requestAnimationFrame(renderFrame);
            window.addEventListener('deviceorientation', handleOrientation);

            // 2. Starta GPS (Nu med robust felhantering och timeout)
            if ("geolocation" in navigator) {
                distanceEl.innerText = "Söker GPS...";
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLng = position.coords.longitude;
                        updateLogic();
                    },
                    (error) => {
                        console.error("GPS Fel:", error);
                        if (error.code === 1) {
                            // Permission denied
                            distanceEl.innerText = "Plats nekad";
                            statusEl.innerText = "Aktivera platstjänster för webbläsaren i telefonens inställningar.";
                        } else if (error.code === 2) {
                            // Position unavailable
                            distanceEl.innerText = "Ingen signal";
                            statusEl.innerText = "Svag GPS-mottagning, vänta...";
                        } else if (error.code === 3) {
                            // Timeout
                            distanceEl.innerText = "GPS Timeout";
                            statusEl.innerText = "Det tog för lång tid. Säkerställ att du är utomhus.";
                        } else {
                            distanceEl.innerText = "GPS Fel";
                        }
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
                );
            } else {
                distanceEl.innerText = "GPS ej stödd";
            }
        }

        function stopTracking() {
            isTracking = false;
            cancelAnimationFrame(animationFrameId);
            window.removeEventListener('deviceorientation', handleOrientation);
            if(watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            stopZoneTimer();
            compassContainer.classList.remove('in-zone');
            inZone = false;
        }

        function goBack() {
            stopTracking();
            distanceEl.innerText = "-- m";
            headingEl.innerText = "--°";
            currentLat = null; currentLng = null;
            
            appScreen.classList.remove('active');
            startScreen.classList.add('active');
        }

        // --- PWA Service Worker (v21) ---
        const swCode = `
            const CACHE_NAME = 'skattjakt-cache-v21';
            self.addEventListener('install', event => {
                event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll([location.href])));
            });
            self.addEventListener('fetch', event => {
                event.respondWith(
                    fetch(event.request).then(response => {
                        return caches.open(CACHE_NAME).then(cache => {
                            cache.put(event.request, response.clone());
                            return response;
                        });
                    }).catch(() => caches.match(event.request))
                );
            });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
        }
    </script>
</div>
</body>
</html>
