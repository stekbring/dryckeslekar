<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Långa bollar på Bengt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'Times New Roman', serif;
      color: #fff;
      padding: 10px;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      z-index: -1;
      background-image: url("bakgrund.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .header-image {
      display: block;
      max-width: 100%;
      height: auto;
      margin-top: 40px;
      margin-bottom: 50px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 2px 2px 6px #000;
    }

    .rules-list {
      background: rgba(0, 0, 0, 0.6);
      list-style-type: none;
      padding: 20px;
      border-radius: 15px;
      max-width: 800px;
      margin: 0 auto;
    }

    .rules-list li {
      margin-bottom: 15px;
      font-size: 1.1em;
      line-height: 1.6;
    }

    .big-text {
      font-size: 1.2em;
      font-weight: bold;
      text-align: center;
      display: block;
      margin: 20px 0;
    }

    h2, h3 {
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .playlist-button {
      display: block;
      margin: 30px auto 40px auto;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: bold;
      text-align: center;
      transition: background 0.3s;
    }

    .playlist-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

  </style>
</head>
<body>

<div class="background"></div>

<img src="rubrik.png" alt="Långa bollar på Bengt" class="header-image">

<!-- Spellistaknapp -->
<div class="playlist-wrapper">
  <a href="https://open.spotify.com/track/6gAPl8snSQiUoAOpLUDIqA?si=e2161bce35be491b" target="_blank" class="playlist-button">
     Öppna låten på Spotify   </a>
</div>

<ul class="rules-list" id="rules"></ul>

<script>
  fetch('instruktioner.txt')
    .then(response => response.text())
    .then(data => {
      const rulesList = document.getElementById('rules');
      const lines = data.split('\n');

      lines.forEach(line => {
        if (line.trim() !== "") {
          let formatted = line
            .replace(/^# (.*)/, '<h2>$1</h2>')
            .replace(/^## (.*)/, '<h3>$1</h3>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/__(.*?)__/g, '<span class="big-text">$1</span>')
            .replace(/--/g, '<br><br>');

          const container = document.createElement('div');
          container.innerHTML = formatted;
          rulesList.appendChild(container);
        }
      });
    })
    .catch(error => {
      console.error("Kunde inte läsa filen:", error);
    });
    /* --- Anpassa dessa --- */
    const GAME_NAME = "Långa bollar på Bengt";  // Lekens namn
    const LOG_ENDPOINT = "https://script.google.com/macros/s/AKfycby6liR-QObWeuuILzhrn90NCF6SEQ4AMHmWHDMf-SWbOSaewXy5ijVsROxYy_q6n5A88A/exec"; // Din Apps Script URL
    /* --------------------- */

    let sessionId;
    let elapsed = 0;
    let timerId = null;

    // 🔸 Skapa / återanvänd sessionId i localStorage
    function initSession() {
      const key = `session_${GAME_NAME}`;
      const existing = localStorage.getItem(key);
      if (existing) {
        sessionId = existing;
      } else {
        sessionId = `${GAME_NAME}_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
        localStorage.setItem(key, sessionId);
      }
    }

    // 🔸 UserAgent-parsning (enkelt)
    function parseUserAgent(ua) {
      let os = "Unknown";
      if (/Windows/i.test(ua)) os = "Windows";
      else if (/Mac/i.test(ua)) os = "Mac";
      else if (/Android/i.test(ua)) os = "Android";
      else if (/iPhone|iPad/i.test(ua)) os = "iOS";
      else if (/Linux/i.test(ua)) os = "Linux";

      let browser = "Unknown";
      if (/CriOS|Chrome/i.test(ua) && !/Edge/i.test(ua)) browser = "Chrome";
      else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
      else if (/Firefox/i.test(ua)) browser = "Firefox";
      else if (/Edge/i.test(ua)) browser = "Edge";

      return { os, browser };
    }

    // 🔸 Hämtar IP en gång per session
    let cachedIP = null;
    async function getIP() {
      if (cachedIP) return cachedIP;
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        cachedIP = data.ip || 'N/A';
      } catch {
        cachedIP = 'N/A';
      }
      return cachedIP;
    }

    // 🔸 Skickar logg till Apps Script
    async function sendLog() {
      const ua = navigator.userAgent || '';
      const { os, browser } = parseUserAgent(ua);
      const ip = await getIP();

      const payload = {
        sessionId: sessionId,
        game: GAME_NAME,
        ip: ip,
        os: os,
        browser: browser,
        screenSize: `${window.screen.width}x${window.screen.height}`,
        referrer: document.referrer || 'Direct',
        url: location.href,
        timeOnPage: elapsed
      };

      const form = new URLSearchParams();
      for (const k in payload) {
        form.append(k, payload[k]);
      }

      fetch(LOG_ENDPOINT, {
        method: 'POST',
        body: form
      }).catch(() => {
        const blob = new Blob([form.toString()], { type: 'application/x-www-form-urlencoded' });
        navigator.sendBeacon(LOG_ENDPOINT, blob);
      });
    }

    // 🔸 Räknar tid & skickar logg var 30:e sekund
    function startTimer() {
      timerId = setInterval(() => {
        if (document.visibilityState === 'visible') {
          elapsed += 30;
          sendLog();
        }
      }, 30000);
    }

    // 🔸 När användaren lämnar — skicka sista loggen
    window.addEventListener('beforeunload', () => {
      sendLog();
    });

    // Initiera
    initSession();
    startTimer();

</script>

</body>
</html>
