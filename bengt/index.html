<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Långa bollar på Bengt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'Times New Roman', serif;
      color: #fff;
      padding: 10px;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      z-index: -1;
      background-image: url("bakgrund.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .header-image {
      display: block;
      max-width: 100%;
      height: auto;
      margin-top: 40px;
      margin-bottom: 50px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 2px 2px 6px #000;
    }

    .rules-list {
      background: rgba(0, 0, 0, 0.6);
      list-style-type: none;
      padding: 20px;
      border-radius: 15px;
      max-width: 800px;
      margin: 0 auto;
    }

    .rules-list li {
      margin-bottom: 15px;
      font-size: 1.1em;
      line-height: 1.6;
    }

    .big-text {
      font-size: 1.2em;
      font-weight: bold;
      text-align: center;
      display: block;
      margin: 20px 0;
    }

    h2, h3 {
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .playlist-button {
      display: block;
      margin: 30px auto 40px auto;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: bold;
      text-align: center;
      transition: background 0.3s;
    }

    .playlist-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

  </style>
</head>
<body>

<div class="background"></div>

<img src="rubrik.png" alt="Långa bollar på Bengt" class="header-image">

<!-- Spellistaknapp -->
<div class="playlist-wrapper">
  <a href="https://open.spotify.com/track/6gAPl8snSQiUoAOpLUDIqA?si=e2161bce35be491b" target="_blank" class="playlist-button">
     Öppna låten på Spotify   </a>
</div>

<ul class="rules-list" id="rules"></ul>

<script>
  fetch('instruktioner.txt')
    .then(response => response.text())
    .then(data => {
      const rulesList = document.getElementById('rules');
      const lines = data.split('\n');

      lines.forEach(line => {
        if (line.trim() !== "") {
          let formatted = line
            .replace(/^# (.*)/, '<h2>$1</h2>')
            .replace(/^## (.*)/, '<h3>$1</h3>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/__(.*?)__/g, '<span class="big-text">$1</span>')
            .replace(/--/g, '<br><br>');

          const container = document.createElement('div');
          container.innerHTML = formatted;
          rulesList.appendChild(container);
        }
      });
    })
    .catch(error => {
      console.error("Kunde inte läsa filen:", error);
    });
    /* --- Anpassa dessa två --- */
    const GAME_NAME = "Långa bollar på Bengt";    // ändra per leksida
    const LOG_ENDPOINT = "https://script.google.com/macros/s/AKfycbz_bNFpua7LMy6I9Cs7H8_wSxWq_cUKAFq5OOa5c-IM/dev"; // din Apps Script URL
    /* ------------------------- */

    let elapsed = 0;
    let sent = false;
    let timerId = null;

    // Enkel UA-parse (OS + browser)
    function parseUserAgent(ua) {
      let os = "Unknown";
      if (/Windows/i.test(ua)) os = "Windows";
      else if (/Mac/i.test(ua)) os = "Mac";
      else if (/Android/i.test(ua)) os = "Android";
      else if (/iPhone|iPad/i.test(ua)) os = "iOS";
      else if (/Linux/i.test(ua)) os = "Linux";

      let browser = "Unknown";
      if (/CriOS|Chrome/i.test(ua) && !/Edge/i.test(ua)) browser = "Chrome";
      else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
      else if (/Firefox/i.test(ua)) browser = "Firefox";
      else if (/Edge/i.test(ua)) browser = "Edge";

      return { os, browser };
    }

    function startCounting() {
      if (timerId) return;
      timerId = setInterval(() => {
        if (document.visibilityState === 'visible') {
          elapsed++;
          // debug: console.log("elapsed:", elapsed);
          if (!sent && elapsed >= 30) {
            sendLog(elapsed);
            sent = true;
            clearInterval(timerId);
          }
        }
      }, 1000);
    }

    document.addEventListener('visibilitychange', () => {
      // timer fortsätter bara räkna när sidan är synlig (fokus)
      // inget särskilt behövs här då interval-koll gör jobbet
    });

    // Kör räknaren direkt vid load
    startCounting();

    // Funktion som skickar loggen — vi skickar form-encoded (URLSearchParams) för enklare CORS
    async function sendLog(timeOnPage) {
      const ua = navigator.userAgent || '';
      const { os, browser } = parseUserAgent(ua);
      const payload = {
        game: GAME_NAME,
        timeOnPage: timeOnPage,
        userAgent: ua,
        os: os,
        browser: browser,
        screenSize: `${window.screen.width}x${window.screen.height}`,
        referrer: document.referrer || 'Direct',
        language: navigator.language || '',
        languages: (navigator.languages && navigator.languages.join ? navigator.languages.join(',') : navigator.language || ''),
        deviceMemory: navigator.deviceMemory || '',
        hardwareConcurrency: navigator.hardwareConcurrency || '',
        doNotTrack: navigator.doNotTrack || navigator.msDoNotTrack || '',
        cookieEnabled: navigator.cookieEnabled,
        connection: (navigator.connection ? { effectiveType: navigator.connection.effectiveType, downlink: navigator.connection.downlink, rtt: navigator.connection.rtt } : {}),
        navType: (performance.getEntriesByType && performance.getEntriesByType('navigation').length) ? performance.getEntriesByType('navigation')[0].type : (performance.navigation ? performance.navigation.type : 'unknown'),
        url: location.href,
        timezoneOffset: new Date().getTimezoneOffset()
      };

      // Hämta publik IP (om möjligt). Om fel: spara "N/A"
      try {
        const r = await fetch('https://api.ipify.org?format=json');
        const j = await r.json();
        payload.ip = j.ip || 'N/A';
      } catch (err) {
        payload.ip = 'N/A';
      }

      // Form-encoding (enkelt för att undvika preflight)
      const form = new URLSearchParams();
      for (const k in payload) {
        if (typeof payload[k] === 'object') form.append(k, JSON.stringify(payload[k]));
        else form.append(k, String(payload[k]));
      }

      // Skicka — vi behöver inte läsa svaret
      fetch(LOG_ENDPOINT, {
        method: 'POST',
        body: form
      }).catch((err) => {
        // fallback: försök sendBeacon (bra vid navigation/close)
        try {
          const blob = new Blob([form.toString()], { type: 'application/x-www-form-urlencoded' });
          navigator.sendBeacon(LOG_ENDPOINT, blob);
        } catch (e) {
          // swallow
        }
      });
    }

</script>

</body>
</html>
