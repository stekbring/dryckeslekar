}
function onFsChange() {
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (!fsEl && document.body.classList.contains('fs') && !isStandalone()) setFs(false);
  else relayout(350);
}
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
function toggleSheet(force) {
  const on = force == null ? !document.body.classList.contains('sheet-open') : force;
  document.body.classList.toggle('sheet-open', on && document.body.classList.contains('fs'));
  if (on) { const box = $('#sheetScroll'); box.scrollTop = box.scrollHeight; }
}
function openMenu() {
  const fs = document.body.classList.contains('fs');
  const item = (act, label, icon, cls) => `<button type="button" class="btn ${cls || 'secondary'}" data-act="${act}">${icon || ''}${label}</button>`;
  openModal(`<h2 id="modalTitle">Meny</h2>
    <div class="menu-list">
      ${item('settings', 'Inställningar', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>')}
      ${item('history', 'Historik', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>')}
      ${item('stats', 'Statistik', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>')}
      ${item('rules', 'Regler', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6.5A2.5 2.5 0 0 0 4 21.5 2.5 2.5 0 0 0 6.5 24H19"/></svg>')}
      ${item('sound', S.sound ? 'Stäng av ljud' : 'Sätt på ljud', S.sound ? SND_ON : SND_OFF)}
      ${installAvailable() ? item('install', 'Installera som app', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>') : ''}
      ${item('new', 'Nytt parti', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>')}
      ${fs ? item('exit', 'Avsluta helskärm', '', 'primary') : ''}
    </div>`);
  $('#modalBody').querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if (a === 'rules') openModal(rulesHTML());
    else if (a === 'stats') openStats(false);
    else if (a === 'history') openHistory();
    else if (a === 'settings') openSettings();
    else if (a === 'install') openInstall();
    else if (a === 'sound') { $('#btnSound').click(); openMenu(); }
    else if (a === 'new') { closeModal(); $('#btnNew').click(); }
    else { closeModal(); setFs(false); }
  }));
}

/* ---------- Installera som app (bara på hemsidan, där manifestet finns) ---------- */
const IS_SITE = !!document.querySelector('link[rel="manifest"]');
let installPrompt = null, apkAvailable = false;
function installAvailable() { return IS_SITE && !isStandalone(); }
function updateInstallBtn() { $('#btnInstall').hidden = !installAvailable(); }
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installPrompt = e; updateInstallBtn();
  if ($('#installBox') && !$('#doInstall')) openInstall();          // ny ikon valdes: visa knappen igen
});
window.addEventListener('appinstalled', () => { installPrompt = null; updateInstallBtn(); });
if (IS_SITE) {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline-läge saknas */ }); });
  }
  fetch('tiotusen.apk', { method: 'HEAD', cache: 'no-store' })
    .then(r => { apkAvailable = r.ok && !/text\/html/i.test(r.headers.get('content-type') || ''); updateInstallBtn(); })
    .catch(() => { /* ingen apk uppladdad */ });
}
function openIconAsk() {
  openModal(`<h2 id="modalTitle">Välj appikon</h2>
    <p class="lead">Så här ser appen ut på hemskärmen. Välj motiv och bakgrundsfärg.</p>
    <div class="icon-hero"><img id="iconHero" alt="Förhandsvisning av appikonen" width="96" height="96"></div>
    ${iconPickerHTML()}
    <p class="muted" style="margin-top:12px">Ikonen följer med när appen installeras. Du kan byta den under Inställningar, men då behöver appen installeras om.</p>
    <div class="card-actions"><button type="button" class="btn primary" id="iconNext">Fortsätt</button></div>`);
  wireIconPicker($('#modalBody'), () => setIconImg($('#iconHero'), iconKind(), iconBg(), true));
  $('#iconNext').addEventListener('click', () => { S.iconAsked = true; savePrefs(); openInstall(); });
}
function openInstall() {
  if (!S.iconAsked) { openIconAsk(); return; }
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua);
  let h = `<h2 id="modalTitle">Spela som app</h2>
    <p class="lead">Som app startar TioTusen i helskärm direkt från hemskärmen, fungerar utan internet och uppdateras av sig själv när sidan uppdateras.</p>
    <div class="inst-icon"><img id="instIcon" alt="" width="52" height="52"><span>Appikon: <b>${ICON_NAMES.find(n => n[0] === iconKind())[1]}</b>, ${ICON_BGS.find(n => n[0] === iconBg())[2].toLowerCase()}</span><button type="button" class="linkbtn" id="chgIcon">Byt</button></div>
    <div class="menu-list" id="installBox">`;
  if (installPrompt) h += '<button type="button" class="btn primary" id="doInstall">Installera appen</button>';
  if (apkAvailable && !ios) h += '<a class="btn secondary" href="tiotusen.apk" download>Ladda ner APK-fil</a>';
  h += '</div>';
  if (!installPrompt) {
    h += ios
      ? '<p style="margin-top:14px">På iPhone: tryck på <b>Dela</b> i Safari och välj <b>Lägg till på hemskärmen</b>.</p>'
      : '<p style="margin-top:14px">Öppna webbläsarens meny <b>⋮</b> och välj <b>Installera app</b> eller <b>Lägg till på startskärmen</b>.</p>';
  }
  if (apkAvailable && !ios) h += '<p class="muted" style="margin-top:10px">APK-filen öppnar du när den har laddats ner. Första gången behöver telefonen tillåta att Chrome installerar appar.</p>';
  if (apkAvailable && !ios) h += '<p class="muted">APK-filen har den ikon den byggdes med.</p>';
  openModal(h);
  setIconImg($('#instIcon'), iconKind(), iconBg(), true);
  $('#chgIcon').addEventListener('click', openIconAsk);
  const b = $('#doInstall');
  if (b) b.addEventListener('click', async () => {
    const p = installPrompt; installPrompt = null;
    try { await p.prompt(); await p.userChoice; }
    catch (e) { openInstall(); return; }                            // gammal installationsruta (t.ex. efter ikonbyte): visa menyvägen
    closeModal(); updateInstallBtn();
  });
}

/* ---------- Knappar ---------- */
$('#btnRoll').addEventListener('click', () => {
  Snd.init();
  if (S.view === 'setup' || !S.game) { startFromSetup(); return; }
  const g = S.game;
  if (g.over) { closeModal(); rematch(); return; }
  if (isCpu(g.players[g.cur])) return;
  doRoll();
});
$('#btnBank').addEventListener('click', () => {
  const g = S.game; if (!g || g.over || isCpu(g.players[g.cur])) return;
  doBank();
});
$('#btnTips').addEventListener('click', () => { S.tips = !S.tips; savePrefs(); render(); });
$('#btnHints').addEventListener('click', () => { S.hints = !S.hints; savePrefs(); render(); });
$('#tip').addEventListener('click', e => {
  if (e.target.id !== 'useTip' || !curTipPlan || S.busy) return;
  const g = S.game, t = g.turn; if (t.phase !== 'choose' || isCpu(g.players[g.cur])) return;
  const set = new Set(curTipPlan.slots);
  t.dice.forEach(d => { d.sel = d.live && set.has(d.slot); });
  Snd.tick(); save(); render();
});
$('#btnRules').addEventListener('click', () => openModal(rulesHTML()));
$('#btnFs').addEventListener('click', () => setFs(!document.body.classList.contains('fs')));
$('#btnInstall').addEventListener('click', openInstall);
$('#fsExit').addEventListener('click', () => setFs(false));
$('#fsMenu').addEventListener('click', openMenu);
$('#btnMenu').addEventListener('click', openMenu);
$('#btnHistory').addEventListener('click', () => openHistory());
$('#btnSettings').addEventListener('click', () => openSettings());
$('#fsRot').addEventListener('click', rotateScreen);
$('#fsRot').hidden = !IS_TOUCH;
$('#fsSheet').addEventListener('click', () => toggleSheet());
$('#padClose').addEventListener('click', () => toggleSheet(false));
$('#chips').addEventListener('click', () => { if (document.body.classList.contains('fs')) toggleSheet(); });
$('#fsSnd').addEventListener('click', () => $('#btnSound').click());
$('#btnStats').addEventListener('click', () => openStats(false));
$('#btnSound').addEventListener('click', () => { S.sound = !S.sound; savePrefs(); renderSound(); if (S.sound) Snd.tick(); });
$('#btnNew').addEventListener('click', () => {
  const g = S.game;
  if (S.view === 'game' && g && !g.over && g.players.some(p => p.cells.length || p === g.players[g.cur] && g.turn.rolls)) confirmNew();
  else goSetup();
});
document.addEventListener('keydown', e => {
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tg = e.target;
  if (tg && tg.closest && tg.closest('input,select,textarea')) return;
  const onButton = tg && tg !== document.body && tg.closest && tg.closest('button,a');
  if (e.key === ' ' || e.code === 'Space') {
    if (onButton) return;
    e.preventDefault(); const b = $('#btnRoll'); if (!b.disabled && S.view === 'game') b.click();
  } else if (e.key === 'Enter') {
    if (onButton) return;
    const b = $('#btnBank'); if (!b.hidden && !b.disabled) { e.preventDefault(); b.click(); }
  } else if ((e.key === 't' || e.key === 'T') && S.view === 'game') {
    $('#btnTips').click();
  } else if ((e.key === 'p' || e.key === 'P') && S.view === 'game') {
    $('#btnHints').click();
  } else if ((e.key === 'f' || e.key === 'F') && S.view === 'game') {
    setFs(!document.body.classList.contains('fs'));
  } else if (e.key === 'Escape' && document.body.classList.contains('fs')) {
    if (document.body.classList.contains('sheet-open')) toggleSheet(false); else setFs(false);
  }
});
let rsz = null;
window.addEventListener('resize', () => {
  clearTimeout(rsz);
  rsz = setTimeout(() => { if (S.view === 'setup' || !S.game || S.game.turn.phase === 'start') lineUp(0); else { placeKept(S.game.turn, 0); nudgeDice(250); } glKick(400); ensureTableTexture(); }, 250);
});

/* ---------- Start ---------- */
function start(data) {
  const hotGame = data && data.game && data.game.players ? data.game : null;
  if (hotGame && !hotGame.over && data.view === 'game') { renderSetup(); applyLook(); applyAppIcon(); glInit(); glSetLook(); restore(hotGame); return; }
  // Flytta ett sparat parti från den äldre versionen in i historiken
  const old = store.get(KEYS.game, null);
  if (old && old.players && old.turn) { if (!old.started) old.started = parseInt(old.id, 36) || Date.now(); saveGame(old); store.del(KEYS.game); }
  applyRules(S.rulesPref);
  S.saved = latestUnfinished();
  renderSetup();
  lineUp(0);
  applyLook();
  applyAppIcon();
  render();
  glInit();
  glSetLook();
  updateInstallBtn();
  requestAnimationFrame(() => lineUp(0));
  setTimeout(tables, 400);
}
try { window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function' && window.claude.hot.snapshot(() => ({ game: S.game, view: S.view })); } catch (e) { /* inget */ }
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
