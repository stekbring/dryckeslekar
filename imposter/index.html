<!DOCTYPE html>
<html lang="sv">
<head>
  

  <meta charset="UTF-8">
  <title>Who's the Imposter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    /* =====================================================================
       VERSION – höj denna när du byter ut en BILD i den här leken
       (t.ex. "1" till "2"). Då hämtar alla besökare den nya bilden direkt
       i stället för den gamla som ligger sparad i deras webbläsare.
       Text i den här filen och i .txt-filer syns alltid direkt ändå.
       ===================================================================== */
    var VERSION = "1";

    function v(url) { return url + "?v=" + VERSION; }
    (function () {
      var bakgrund = "webb/background.webp";
      var forst = ["webb/rubrik.webp"];
      if (bakgrund) {
        document.documentElement.style.setProperty("--bg", 'url("' + v(bakgrund) + '")');
        forst.unshift(bakgrund);
      }
      forst.forEach(function (h) {
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "image"; l.href = v(h);
        document.head.appendChild(l);
      });
    })();
    /* Textfilen börjar hämtas direkt (alltid senaste versionen från servern) */
    var textLaddas = fetch("platser.txt", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); });
  </script>
  <script src="/analytics.js" defer></script>
  <link rel="icon" type="image/x-icon" href="imposterlogga.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Arial', sans-serif; }
    html { background-color: #0a0a0f; }
    .background { position: fixed; top: 0; left: 0; height: 100vh; width: 100vw; z-index: -1; background-color: #0a0a0f; background-image: var(--bg); background-size: cover; background-position: center; background-repeat: no-repeat; }
    body { padding: 60px 10px 10px 10px; color: #fff; }
    h1, h2 { text-align: center; text-shadow: 2px 2px 6px #000; margin-bottom: 20px; }
    .container { background: none; border-radius: 15px; padding: 20px; max-width: 800px; margin: 0 auto; }
    .header-image { max-width: 100%; height: auto; display: block; margin: 0 auto 30px auto; border-radius: 10px; }
    input, button { display: block; margin-bottom: 15px; padding: 10px; font-size: 1em; border-radius: 10px; border: none; }
    .name-input-wrapper { position: relative; margin-bottom: 15px; }
    .name-input { width: 100%; }
    .remove-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: #c00; color: #fff; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 16px; line-height: 20px; padding: 0; }
    button { background-color: #444; color: #fff; cursor: pointer; }
    button:hover { background-color: #666; }
    .player-btn { margin: 15px 0; padding: 10px; font-size: 1em; width: 100%; border-radius: 10px; }
    .used { background-color: #777 !important; cursor: not-allowed; }
    #overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.7); z-index: 999; }
    #revealBox {
      display: none;
      position: fixed;
      top: 45%; /* lyfter upp rutan lite */
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.85);
      padding: 25px 40px 15px 40px; /* mer plats åt höger, vänster och över, men inte under */
      border-radius: 20px;
      text-align: center;
      color: #fff;
      z-index: 1000;
      max-width: 360px; /* gör rutan bredare */
    }

    #revealBox button { margin-top: 25px; width: 100%; }
    .imposter-text { color: red; font-weight: bold; font-size: 1.2em; }
    #game, #roundControl { display: none; }
    #roundControl { margin-top: 60px; }
    .small-button { padding: 8px 16px; font-size: 0.9em; display: inline-block; margin-top: 0px; width: auto; }
    .start-button { margin-top: 25px; width: 100%; }
    .inline-flex { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    .disabled { opacity: 0.5; pointer-events: none; }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9em;
      color: #fff;
    }
    .checkbox-label input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #444;
      border-radius: 5px;
      cursor: pointer;
      margin: 0;
    }

    .imposter-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      flex-grow: 1;
    }
    .imposter-btn {
      background-color: #444;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-top: 5px;
    }
    .imposter-value {
      min-width: 30px;
      text-align: center;
      font-size: 1.4em;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .imposter-disabled {
      opacity: 0.5;
    }

    .custom-location-label {
      margin-top: 30px;
      display: block;
      margin-bottom: 10px;
    }
    #customLocation {
      width: 100%;
    }
    .inline-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .inline-buttons button {
      flex: 1;
      width: 100%;
    }
    .clear-button {
      background-color: #444;
      color: red;
    }
    .clear-button:hover {
      background-color: #666;
      color: #ff6666;
    }

    /* Full width buttons */
    #setup > button,
    #roundControl > button,
    #revealBox button {
      width: 100%;
    }
    /* === Vem börjar-popup === */
    /* === Vem börjar-popup (förbättrad) === */
    /* === Vem börjar-popup (kompakt & centrerad) === */
    #starterPopup {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.9);
      border-radius: 20px;
      padding: 10px;
      text-align: center;
      color: #fff;
      z-index: 1200;
      width: 250px;   /* mindre popup */
      height: 250px;  /* mindre popup */
      overflow: hidden;
    }

    #starterOverlay { display: none; position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.7); z-index: 1100; }

    #wheelContainer {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #wheelNames {
      position: absolute;
      width: 200px;  /* fast storlek eller max 80% av popupen */
      height: 200px; /* samma som width */
      top: 50%;
      left: 50%;
      border-radius: 50%;
      transform: translate(-50%, -52%);
      transition: opacity 0.5s ease;
    }

    #wheelNames span {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: center;
      font-size: 0.8em;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 3px #000;
    }

    /* Pilen */
    #wheelArrow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 80%; /* anpassar sig snyggt i mindre ruta */
      height: auto;
      transform: translate(-50%, -50%) rotate(0deg);
      transition: transform 0.1s linear;
      z-index: 10;
    }

    #chosenName {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.4em;
      font-weight: bold;
      color: #ff1d1d;
      display: none;
      z-index: 20;
    }

    #closeStarterBtn {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      padding: 6px 14px;
      font-size: 0.85em;
      border-radius: 10px;
      background-color: #444;
      color: white;
      z-index: 30;
    }

    .dimmed {
      opacity: 0.10;
      transition: opacity 0.5s ease;
    }
    #startPickerBtn {
      display: block;
      margin: 20px auto; /* centrerar horisontellt */
      margin-top: 50px;
      padding: 8px 8px;
      font-size: 0.9em;
    }


  </style>
</head>
<body>
  <div class="background"></div>
  <img data-src="webb/rubrik.webp" alt="Who's the Imposter" class="header-image" width="1496" height="232" fetchpriority="high">
  <div class="container">
    <div id="setup">
      <div id="nameInputsContainer"></div>
      <button onclick="addNameInput()">Lägg till spelare</button>

      <div class="inline-flex">
        <label>Antal imposters:</label>
        <div class="imposter-selector" id="imposterSelector">
          <button type="button" class="imposter-btn" onclick="changeImposters(-1)">−</button>
          <span id="numImpostersValue" class="imposter-value">0</span>
          <button type="button" class="imposter-btn" onclick="changeImposters(1)">+</button>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="randomImpostersCheckbox" onchange="toggleRandomImposters()">
          Slumpa antalet Imposters
        </label>
      </div>

      <label class="custom-location-label">Lägg till egna ord:</label>
      <input type="text" id="customLocation" placeholder="T.ex. Olle Ahlgrens sexkammare">
      <div class="inline-buttons">
        <button class="small-button" onclick="addLocation()">Lägg till plats</button>
        <button class="small-button clear-button" onclick="clearCustomLocations()">Rensa egna ord</button>
      </div>

      <button class="start-button" onclick="startGame()">Starta spelet</button>
    </div>

    <div id="game">
      <h2>Klicka på ditt namn</h2>
      <div id="playerButtons"></div>
      <button id="startPickerBtn" class="startPickerBtn" onclick="openStarterPopup()">Vem börjar?</button>
    </div>

    <div id="roundControl">
      <button onclick="newRound()">Ny runda</button>
      <button onclick="goBack()">Tillbaka</button>
    </div>
  </div>

  <div id="overlay"></div>
  <div id="revealBox">
    <div id="revealText"></div>
    <button onclick="closeReveal()">Stäng</button>
  </div>

  <!-- Popup för Vem börjar -->
  <div id="starterOverlay"></div>
  <div id="starterPopup">
    <div id="wheelContainer">
      <div id="wheelNames"></div>
      <img id="wheelArrow" data-src="webb/pil.webp" alt="Pil" width="480" height="51">
      <div id="chosenName"></div>
      <button id="closeStarterBtn" onclick="closeStarterPopup()">Stäng</button>
    </div>
  </div>

  <script>
    let lastNumImposters = null; // sparar antal imposters från förra rundan
    let defaultLocations = [];
    let locations = [...defaultLocations];
    let players = [];
    let roles = {};
    let currentLocation = "";
    let randomImpostersMode = false;
    let numImposters = 0;

    async function loadLocations() {
      try {
        const text = await textLaddas;   // platser.txt, hämtas redan i <head>
        defaultLocations = text
          .split("\n")
          .map(line => line.trim())
          .filter(line => line.length > 0);
        locations = [...defaultLocations];
        console.log(`Laddade ${locations.length} platser från platser.txt`);
      } catch (error) {
        console.error("Kunde inte läsa platser.txt:", error);
        defaultLocations = ["Biblioteket", "Skola", "Ubåt"]; // fallback
        locations = [...defaultLocations];
      }
    }


    function saveState() {
      localStorage.setItem('savedPlayers', JSON.stringify(players));
      localStorage.setItem('numImposters', numImposters);
      localStorage.setItem('randomImpostersMode', randomImpostersMode);
      localStorage.setItem('customLocations', JSON.stringify(locations.filter(l => !defaultLocations.includes(l))));
    }

    function loadState() {
      const saved = localStorage.getItem('savedPlayers');
      if (saved) players = JSON.parse(saved);
      const savedNum = localStorage.getItem('numImposters');
      if (savedNum !== null) numImposters = parseInt(savedNum);
      randomImpostersMode = localStorage.getItem('randomImpostersMode') === 'true';
      const savedCustom = localStorage.getItem('customLocations');
      if (savedCustom) locations = [...defaultLocations, ...JSON.parse(savedCustom)];
    }

    function createPopup(message) {
      const revealText = document.getElementById('revealText');
      revealText.innerText = message;
      document.getElementById('overlay').style.display = 'block';
      document.getElementById('revealBox').style.display = 'block';
    }

    function createNameInput(name = '', index = null) {
      const wrapper = document.createElement('div');
      wrapper.className = 'name-input-wrapper';

      const input = document.createElement('input');
      input.className = 'name-input';
      input.type = 'text';
      input.placeholder = `Spelare ${index !== null ? index + 1 : document.querySelectorAll('.name-input-wrapper').length + 1}`;
      input.value = name;
      input.onkeydown = handleEnter;
      input.oninput = updatePlayers;

      const remove = document.createElement('button');
      remove.innerText = '×';
      remove.className = 'remove-btn';
      remove.onclick = () => {
        wrapper.remove();
        updatePlayers();
      };

      wrapper.appendChild(input);
      wrapper.appendChild(remove);
      document.getElementById('nameInputsContainer').appendChild(wrapper);
      input.focus();
    }

    function addNameInput() { createNameInput(); }

    function handleEnter(e) {
      if (e.key === 'Enter') {
        const inputs = Array.from(document.querySelectorAll('.name-input'));
        const index = inputs.indexOf(e.target);
        if (index !== -1 && index + 1 < inputs.length) inputs[index + 1].focus();
        else addNameInput();
      }
    }

    function updatePlayers() {
      players = Array.from(document.querySelectorAll('.name-input')).map(input => input.value.trim()).filter(n => n);
      if (numImposters > players.length) numImposters = players.length;
      document.getElementById('numImpostersValue').innerText = randomImpostersMode ? '?' : numImposters;
      saveState();
    }

    function addLocation() {
      const loc = document.getElementById('customLocation').value.trim();
      if (loc) {
        locations.push(loc);
        document.getElementById('customLocation').value = "";
        saveState();
        createPopup(`Lade till plats: ${loc}`);
      }
    }

    function clearCustomLocations() {
      locations = [...defaultLocations];
      saveState();
      createPopup("Egna ord rensades.");
    }

    function toggleRandomImposters() {
      const checkbox = document.getElementById('randomImpostersCheckbox');
      randomImpostersMode = checkbox.checked;
      document.getElementById('numImpostersValue').innerText = randomImpostersMode ? '?' : numImposters;
      document.getElementById('imposterSelector').classList.toggle('imposter-disabled', randomImpostersMode);
      saveState();
    }

    function changeImposters(delta) {
      if (randomImpostersMode) return;
      numImposters = Math.max(0, Math.min(numImposters + delta, players.length));
      document.getElementById('numImpostersValue').innerText = numImposters;
      saveState();
    }

    function startGame() {
      if (players.length < 3) return createPopup("Minst 3 spelare krävs.");

      if (randomImpostersMode) {
        const maxImposters = players.length; // kan inkludera 0
        let newNum;
        do {
          newNum = Math.floor(Math.random() * (maxImposters + 1)); // 0 till max
        } while (newNum === lastNumImposters && maxImposters > 0);
        numImposters = newNum;
        lastNumImposters = numImposters;
      }
      document.getElementById('setup').style.display = 'none';
      document.getElementById('game').style.display = 'block';
      document.getElementById('roundControl').style.display = 'block';
      assignRoles(numImposters);
    }

    // Rättvis blandning (Fisher–Yates)
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function assignRoles(numImposters) {
      roles = {};
      // Roller kopplas till spelarens plats i listan, så två spelare med samma namn funkar också
      const imposterIndex = shuffle(players.map((_, i) => i)).slice(0, numImposters);
      currentLocation = locations[Math.floor(Math.random() * locations.length)];

      players.forEach((p, i) => {
        roles[i] = imposterIndex.includes(i) ? "Imposter" : currentLocation;
      });

      const container = document.getElementById('playerButtons');
      container.innerHTML = "";
      players.forEach((p, i) => {
        const btn = document.createElement('button');
        btn.innerText = p;
        btn.className = 'player-btn';
        btn.onclick = function() {
          if (btn.classList.contains('used')) return;
          btn.classList.add('used');
          btn.disabled = true;
          const revealText = document.getElementById('revealText');
          if (roles[i] === "Imposter") {
            revealText.innerHTML = `<img src="${v('webb/imposter2.webp')}" alt="IMPOSTER!" width="648" height="208" style="max-width:100%; height:auto;">`;
          } else {
            revealText.innerText = `${roles[i]}`;
          }
          document.getElementById('overlay').style.display = 'block';
          document.getElementById('revealBox').style.display = 'block';
        };
        container.appendChild(btn);
      });
    }

    function newRound() {
      closeReveal();
      if (randomImpostersMode) {
        const maxImposters = players.length;
        let newNum;
        do {
          newNum = Math.floor(Math.random() * (maxImposters + 1));
        } while (newNum === lastNumImposters && maxImposters > 0);
        numImposters = newNum;
        lastNumImposters = numImposters;
      }
      assignRoles(numImposters);
      Array.from(document.querySelectorAll('.player-btn')).forEach(btn => {
        btn.classList.remove('used');
        btn.disabled = false;
      });
    }

    function closeReveal() {
      document.getElementById('revealBox').style.display = 'none';
      document.getElementById('overlay').style.display = 'none';
    }

    function goBack() {
      document.getElementById('setup').style.display = 'block';
      document.getElementById('game').style.display = 'none';
      document.getElementById('roundControl').style.display = 'none';
    }

    window.onload = async () => {
      await loadLocations();
      loadState();
      const container = document.getElementById('nameInputsContainer');
      container.innerHTML = "";
      if (players.length > 0) {
        players.forEach((name, i) => createNameInput(name, i));
      } else {
        ["", "", ""].forEach((_, i) => createNameInput("", i));
      }
      document.getElementById('numImpostersValue').innerText = randomImpostersMode ? '?' : numImposters;
      document.getElementById('randomImpostersCheckbox').checked = randomImpostersMode;
      document.getElementById('imposterSelector').classList.toggle('imposter-disabled', randomImpostersMode);
    }

    // === Vem börjar-funktioner ===
    let spinning = false;
    let currentRotation = 0;

    function openStarterPopup() {
      if (players.length === 0) return createPopup("Inga spelare ännu!");

      const overlay = document.getElementById("starterOverlay");
      const popup = document.getElementById("starterPopup");
      const namesContainer = document.getElementById("wheelNames");
      const chosenNameEl = document.getElementById("chosenName");
      const closeBtn = document.getElementById("closeStarterBtn");
      const arrow = document.getElementById("wheelArrow");

      overlay.style.display = "block";
      popup.style.display = "block";
      chosenNameEl.style.display = "none";
      closeBtn.style.display = "none";

      namesContainer.innerHTML = "";
      const playerCount = players.length;
      const angleStep = 360 / playerCount;

      // Placera namn runt cirkeln
      players.forEach((name, i) => {
        const angle = i * angleStep;
        const span = document.createElement("span");
        span.style.transform = `rotate(${angle}deg) translate(0, -100px) rotate(${-angle}deg) translateX(-50%)`;

        span.innerText = name;
        namesContainer.appendChild(span);
      });

      animateSpin(playerCount, arrow, chosenNameEl, closeBtn);
    }

    function animateSpin(playerCount, arrow, highlightNameEl, closeBtn) {
      if (spinning) return;
      spinning = true;
      highlightNameEl.style.display = "none";
      document.getElementById("wheelNames").classList.remove("dimmed");
      arrow.classList.remove("dimmed");

      let targetIndex = null;
      let targetAngle = null;

      if (playerCount >= 2) {
        const anglePer = 360 / playerCount;
        targetIndex = Math.floor(Math.random() * playerCount);
        const offset = (Math.random() - 0.5) * anglePer * 0.24;  // lite slump, men alltid tydligt på ett namn
        targetAngle = targetIndex * anglePer - 90 + offset;       // -90 eftersom pilbilden pekar åt höger
      } else {
        targetAngle = Math.random() * 360;
      }

      const accelTime = 1000;
      const steadyTime = 1500;
      const decelTime = 1500;
      const total = accelTime + steadyTime + decelTime;

      const fullSpins = 5 + Math.floor(Math.random() * 3);
      const currentNorm = ((currentRotation % 360) + 360) % 360;
      const finalDelta = fullSpins * 360 + ((targetAngle - currentNorm + 360) % 360);

      const start = performance.now();

      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function step(now) {
        const elapsed = now - start;
        const t = Math.min(elapsed / total, 1);
        const eased = easeInOutCubic(t);
        const rotation = currentRotation + finalDelta * eased;
        arrow.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;

        if (elapsed < total) {
          requestAnimationFrame(step);
        } else {
          currentRotation = rotation;
          spinning = false;

          // Visa resultat
          const chosenIndex = getPlayerIndexFromRotation(currentRotation, playerCount);
          const chosenPlayer = players[chosenIndex];
          highlightNameEl.innerText = chosenPlayer;
          highlightNameEl.style.display = "block";
          closeBtn.style.display = "block";

          // Dämpa övriga element
          document.getElementById("wheelNames").classList.add("dimmed");
          arrow.classList.add("dimmed");
        }
      }

      requestAnimationFrame(step);
    }


    function closeStarterPopup() {
      document.getElementById("starterOverlay").style.display = "none";
      document.getElementById("starterPopup").style.display = "none";
      spinning = false;
    }

    function getPlayerIndexFromRotation(rotation, playerCount) {
      const anglePer = 360 / playerCount;
      // Normera rotation 0-360
      const normRot = ((rotation % 360) + 360) % 360;
      // Kompensera pilens startvinkel (uppåt)
      const adjustedRot = (normRot + 90 + anglePer / 2) % 360;
      // Räkna index
      const index = Math.floor(adjustedRot / anglePer);
      return index;
    }


  </script>
<script>
  /* Bildadresser med versionsnummer */
  (function () {
    var bilder = document.querySelectorAll("img[data-src]");
    for (var i = 0; i < bilder.length; i++) bilder[i].src = v(bilder[i].getAttribute("data-src"));
  })();

  /* Sparar sidans bilder i webbläsaren så nästa besök går snabbare (se /sw.js) */
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
      function forladda() {
        var sw = navigator.serviceWorker.controller;
        if (!sw) return;
        var urls = ["webb/background.webp", "webb/imposter2.webp", "webb/pil.webp"].map(v);
        document.querySelectorAll("img[data-src]").forEach(function (b) { urls.push(v(b.getAttribute("data-src"))); });
        sw.postMessage({ typ: "forladda", urls: urls.map(function (u) { return new URL(u, location.href).href; }) });
      }
      navigator.serviceWorker.addEventListener("controllerchange", forladda);
      setTimeout(forladda, 1500);
    });
  }
</script>
</body>
</html>
