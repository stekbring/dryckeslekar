<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skattjakt Kompass</title>
    <style>
        :root {
            /* Färgpalett från bilden */
            --col-1: #EDE5BE; /* Ljusast (Bakgrund) */
            --col-2: #C9C3A1;
            --col-3: #A19B81;
            --col-4: #787460;
            --col-5: #4F4C3F; /* Mörkast (Text/Kontrast) */
            
            --bg-color: var(--col-1);
            --text-color: var(--col-5);
            --accent-color: var(--col-4);
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            max-width: 400px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--col-5);
            letter-spacing: -0.5px;
        }

        p {
            color: var(--col-4);
            line-height: 1.5;
            margin-bottom: 30px;
        }

        #app-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        button {
            background-color: var(--col-5);
            color: var(--col-1);
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 76, 63, 0.2);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(79, 76, 63, 0.2);
        }

        #compass-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 50px 0;
            border-radius: 50%;
            background-color: var(--col-1);
            box-shadow: 
                8px 8px 16px rgba(120, 116, 96, 0.2), 
                -8px -8px 16px rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #arrow {
            width: 90%;
            height: 90%;
            /* JavaScript sköter animationen */
        }

        .data-text {
            font-size: 2.8rem;
            font-weight: 800;
            margin: 5px 0 20px 0;
            color: var(--col-5);
            letter-spacing: -1px;
        }

        .label {
            font-size: 0.8rem;
            color: var(--col-4);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        #status {
            font-size: 0.85rem;
            color: var(--col-4);
            margin-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>Skattjakt</h1>
        <p>Denna webbapp kräver tillgång till din plats och kompass för att guida dig rätt.</p>
        <button id="start-btn">Starta Navigering</button>
        <p id="status">Klar att starta.</p>
    </div>

    <div id="app-screen">
        <div class="label">Avstånd till mål</div>
        <div id="distance" class="data-text">Söker GPS...</div>
        
        <div id="compass-container">
            <!-- Uppdaterad SVG Pil för kompassen baserat på paletten -->
            <svg id="arrow" viewBox="0 0 100 100">
                <!-- Yttre dekorativ ring -->
                <circle cx="50" cy="50" r="48" fill="none" stroke="var(--col-2)" stroke-width="2"/>
                <circle cx="50" cy="50" r="42" fill="none" stroke="var(--col-3)" stroke-width="1" stroke-dasharray="4 4"/>
                
                <!-- Kompassnål Norr (mörk) -->
                <polygon points="50,12 58,50 50,50" fill="var(--col-5)" />
                <polygon points="50,12 42,50 50,50" fill="var(--col-4)" />
                
                <!-- Kompassnål Söder (ljusare) -->
                <polygon points="50,88 58,50 50,50" fill="var(--col-3)" />
                <polygon points="50,88 42,50 50,50" fill="var(--col-2)" />
                
                <!-- Centrum -->
                <circle cx="50" cy="50" r="4" fill="var(--col-1)" stroke="var(--col-5)" stroke-width="2"/>
            </svg>
        </div>

        <div class="label">Riktning</div>
        <div id="heading" class="data-text">--°</div>
    </div>

    <script>
        // --- INSTÄLLNINGAR ---
        const TARGET_LAT = 56.996242; 
        const TARGET_LNG = 15.275598;


        // --- VARIABLER ---
        let currentLat = null;
        let currentLng = null;
        let currentHeading = 0;
        let bearingToTarget = 0;
        
        // Variabler för mjuk 60fps animering
        let targetVisualRotation = 0;
        let currentVisualRotation = 0;

        const startScreen = document.getElementById('start-screen');
        const appScreen = document.getElementById('app-screen');
        const startBtn = document.getElementById('start-btn');
        const distanceEl = document.getElementById('distance');
        const arrowEl = document.getElementById('arrow');
        const headingEl = document.getElementById('heading');
        const statusEl = document.getElementById('status');

        // --- MATEMATIK ---
        function toRad(deg) { return deg * Math.PI / 180; }
        function toDeg(rad) { return rad * 180 / Math.PI; }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        function calculateBearing(lat1, lng1, lat2, lng2) {
            const dLon = toRad(lng2 - lng1);
            const y = Math.sin(dLon) * Math.cos(toRad(lat2));
            const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                      Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
            let brng = toDeg(Math.atan2(y, x));
            return (brng + 360) % 360;
        }

        // --- LOGIK-UPPDATERING (Sätter målvärden) ---
        function updateLogic() {
            if (currentLat === null || currentLng === null) return;

            const dist = calculateDistance(currentLat, currentLng, TARGET_LAT, TARGET_LNG);
            bearingToTarget = calculateBearing(currentLat, currentLng, TARGET_LAT, TARGET_LNG);

            // Uppdatera text med palettens färger
            if (dist <= 5) {
                distanceEl.innerText = "MÅL NÅTT!";
                distanceEl.style.color = "var(--col-5)";
            } else {
                distanceEl.innerText = dist + " m";
                distanceEl.style.color = "var(--col-5)";
            }
            headingEl.innerText = Math.round(currentHeading) + "°";

            // Räkna ut önskad rotation på pilen
            let rawTarget = bearingToTarget - currentHeading;
            
            // Hitta kortaste vägen för rotationen för att undvika spinn (snabb matematik för -180 till +180)
            let diff = rawTarget - targetVisualRotation;
            diff = ((diff + 540) % 360) - 180;
            targetVisualRotation += diff;
        }

        // --- VISUELL RENDER-LOOP (60fps) ---
        function renderFrame() {
            // Lerp (Linear Interpolation) mjukar upp rörelsen
            const smoothingFactor = 0.2; 
            
            currentVisualRotation += (targetVisualRotation - currentVisualRotation) * smoothingFactor;
            
            // Uppdatera DOM exakt synkat med skärmuppdateringen
            arrowEl.style.transform = `rotate(${currentVisualRotation}deg)`;
            
            // Begär nästa bildruta
            requestAnimationFrame(renderFrame);
        }

        // --- BEHÖRIGHETER & SENSORER ---
        async function startApp() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        statusEl.innerText = "Kompass nekad. Måste godkännas i inställningar.";
                        return;
                    }
                } catch (error) {
                    statusEl.innerText = "Kunde inte begära kompass-rättigheter.";
                    return;
                }
            }

            startScreen.style.display = 'none';
            appScreen.style.display = 'flex';

            // Starta den mjuka renderingsloopen
            requestAnimationFrame(renderFrame);

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLng = position.coords.longitude;
                        updateLogic();
                    },
                    (error) => {
                        distanceEl.innerText = "GPS Fel";
                        console.error(error);
                    },
                    { enableHighAccuracy: true, maximumAge: 0 }
                );
            } else {
                distanceEl.innerText = "GPS ej stödd";
            }

            window.addEventListener('deviceorientation', (event) => {
                if (event.webkitCompassHeading) {
                    currentHeading = event.webkitCompassHeading;
                } else if (event.alpha !== null) {
                    currentHeading = 360 - event.alpha;
                }
                updateLogic();
            });
        }

        startBtn.addEventListener('click', startApp);

        // --- PWA & OFFLINE CACHE ---
        const swCode = `
            const CACHE_NAME = 'skattjakt-cache-v5'; // Uppdaterad version
            
            self.addEventListener('install', event => {
                event.waitUntil(
                    caches.open(CACHE_NAME).then(cache => {
                        return cache.addAll([location.href]); 
                    })
                );
            });

            self.addEventListener('fetch', event => {
                event.respondWith(
                    fetch(event.request).then(networkResponse => {
                        return caches.open(CACHE_NAME).then(cache => {
                            cache.put(event.request, networkResponse.clone());
                            return networkResponse;
                        });
                    }).catch(() => {
                        return caches.match(event.request);
                    })
                );
            });
        `;
        
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swUrl).then(() => {
                console.log('Service Worker registrerad för offline-bruk.');
            }).catch(err => console.error(err));
        }
    </script>
</body>
</html>
