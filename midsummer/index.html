<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Midsommarjakten 2026 - Nedräkning</title>
    <link rel="stylesheet" href="https://use.typekit.net/gql3yae.css">
    <style>
        :root {
            /* Färgpalett */
            --col-1: #EDE5BE; /* Bakgrund */
            --col-2: #C9C3A1;
            --col-3: #A19B81;
            --col-4: #787460;
            --col-5: #4F4C3F; /* Text och accenter */
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: var(--col-1);
            color: var(--col-5);
            font-family: antiquarian, sans-serif;
            font-variant-numeric: lining-nums;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 3D KARTBAKGRUND (Samma som huvudappen) */
        .map-background {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            z-index: 0;
            opacity: 0.35;
            pointer-events: none;
            transform: perspective(1000px) rotateX(55deg) rotateZ(-20deg);
            transform-origin: center center;
        }

        .map-background svg {
            width: 100%;
            height: 100%;
        }

        /* INNEHÅLL */
        .content-container {
            z-index: 10;
            text-align: center;
            background: rgba(237, 229, 190, 0.7);
            padding: 4vh 30px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 8px 32px rgba(79, 76, 63, 0.1);
            max-width: 90vw;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            font-family: antiquarian-scribe, sans-serif;
            font-weight: 700;
            color: var(--col-5);
            letter-spacing: -1px;
            margin-bottom: 3vh;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 1.2rem);
            color: var(--col-4);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1vh;
        }

        /* NEDRÄKNING */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 2vh;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-value {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-family: antiquarian-scribe, sans-serif;
            font-weight: 800;
            color: var(--col-5);
            line-height: 1;
        }

        .time-label {
            font-size: 0.8rem;
            color: var(--col-4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            font-weight: 600;
        }
        
        .message {
            font-size: 1.5rem;
            color: var(--col-5);
            font-weight: bold;
            margin-top: 20px;
            display: none; /* Döljs tills tiden är inne */
        }
    </style>
</head>
<body>

    <!-- 3D BAKGRUND -->
    <div class="map-background">
        <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
            <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
                <path d="M 100 0 L 0 0 0 100" fill="none" stroke="var(--col-2)" stroke-width="1"/>
            </pattern>
            <rect width="100%" height="100%" fill="url(#grid)" />
            <g fill="none" stroke="var(--col-4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M-100,200 C150,150 250,300 500,250 C700,210 800,400 1100,350" />
                <path d="M-100,300 C200,250 300,400 550,350 C750,310 850,500 1100,450" />
                <path d="M100,100 C300,50 400,200 650,150 C850,110 950,300 1200,250" opacity="0.5"/>
                <path d="M-50,600 C200,500 400,700 700,550 C900,450 950,700 1100,600" />
                <path d="M-50,700 C250,600 450,800 750,650 C950,550 1000,800 1100,700" />
                <path d="M700,800 C650,820 620,870 650,920 C680,970 750,950 780,900 C810,850 750,780 700,800 Z" />
                <path d="M710,830 C680,840 660,870 680,900 C700,930 740,920 750,890 C760,860 740,820 710,830 Z" opacity="0.6"/>
                <path d="M705,860 L725,880 M725,860 L705,880" stroke="var(--col-5)" stroke-width="4" />
            </g>
        </svg>
    </div>

    <!-- INNEHÅLL -->
    <div class="content-container">
        <div class="subtitle">Snart är det dags för</div>
        <h1>Midsommarjakten 2026</h1>
        
        <div class="countdown-grid" id="countdown">
            <div class="time-box">
                <div class="time-value" id="days">--</div>
                <div class="time-label">Dagar</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="hours">--</div>
                <div class="time-label">Timmar</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="minutes">--</div>
                <div class="time-label">Minuter</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="seconds">--</div>
                <div class="time-label">Sekunder</div>
            </div>
        </div>
        
        <div class="message" id="ready-message">Jakten har börjat!</div>
    </div>

    <script>
        // Sätt måldatumet: 19 Juni 2026 kl 17:00:00 (Svensk tid)
        const targetDate = new Date('2026-06-19T17:00:00').getTime();

        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const countdownEl = document.getElementById('countdown');
        const messageEl = document.getElementById('ready-message');

        function updateCountdown() {
            const now = new Date().getTime();
            const timeRemaining = targetDate - now;

            if (timeRemaining <= 0) {
                // Tiden är inne
                countdownEl.style.display = 'none';
                messageEl.style.display = 'block';
                return;
            }

            // Beräkna tid
            const days = Math.floor(timeRemaining / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeRemaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeRemaining % (1000 * 60)) / 1000);

            // Formatera med inledande nolla om det är under 10
            daysEl.innerText = days < 10 ? '0' + days : days;
            hoursEl.innerText = hours < 10 ? '0' + hours : hours;
            minutesEl.innerText = minutes < 10 ? '0' + minutes : minutes;
            secondsEl.innerText = seconds < 10 ? '0' + seconds : seconds;
        }

        // Uppdatera direkt och sedan varje sekund
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
