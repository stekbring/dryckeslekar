<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Midsommarjakten 2026</title>
    <link rel="stylesheet" href="https://use.typekit.net/gql3yae.css">
    <style>
        :root {
            /* Färgpalett */
            --col-1: #EDE5BE; /* Bakgrund */
            --col-2: #C9C3A1;
            --col-3: #A19B81;
            --col-4: #787460;
            --col-5: #4F4C3F; /* Text och accenter */
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--col-1);
            color: var(--col-5);
            font-family: antiquarian, sans-serif;
            font-variant-numeric: lining-nums; /* Tvingar fram fullstora siffror om typsnittet stödjer det */
            overflow: hidden; /* Förhindrar scroll på bakgrunden */
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* 3D KARTBAKGRUND */
        .map-background {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            z-index: 0;
            opacity: 0.35;
            pointer-events: none;
            /* Skapar 3D-vinkeln från sidan */
            transform: perspective(1000px) rotateX(55deg) rotateZ(-20deg);
            transform-origin: center center;
        }

        .map-background svg {
            width: 100%;
            height: 100%;
        }

        /* SKÄRM-HANTERING (SPA) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        /* TYPOGRAFI OCH UI - STARTSKÄRM */
        .header-container {
            text-align: center;
            margin-top: 2vh;
            margin-bottom: 4vh;
            background: rgba(237, 229, 190, 0.7); /* Lätt transparens för läsbarhet */
            padding: 15px 30px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 2.2rem;
            font-family: antiquarian-scribe, sans-serif;
            font-weight: 700;
            color: var(--col-5);
            letter-spacing: -1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        /* Manuell storleksökning för siffror */
        .num {
            font-size: 1.2em;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--col-4);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* LAG-KNAPPAR */
        .team-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .team-btn {
            background-color: var(--col-1);
            border: 2px solid var(--col-3);
            border-radius: 16px;
            padding: 20px;
            text-align: center; /* Centrerad text */
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(79, 76, 63, 0.1);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            font-family: antiquarian, sans-serif; /* Tvingar ärvning till knappen */
        }

        /* Liten dekorativ detalj på knappen */
        .team-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background-color: var(--col-5);
        }

        .team-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 8px rgba(79, 76, 63, 0.1);
            background-color: var(--col-2);
        }

        .team-name {
            display: block;
            font-size: 1.8rem; /* Ökad storlek */
            font-family: antiquarian-scribe, sans-serif;
            font-weight: 700;
            color: var(--col-5);
            margin-bottom: 8px;
        }

        .team-members {
            display: block;
            font-size: 1.1rem; /* Ökad storlek */
            font-family: antiquarian, sans-serif; /* Explicit typsnitt */
            color: var(--col-4);
            line-height: 1.4;
            font-weight: 500;
        }
        
        /* KOMPASS STYLING */
        #app-screen {
            justify-content: flex-start;
        }

        #compass-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 25px 0;
            border-radius: 50%;
            background-color: var(--col-1);
            box-shadow: 
                8px 8px 16px rgba(120, 116, 96, 0.2), 
                -8px -8px 16px rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #arrow {
            width: 90%;
            height: 90%;
        }

        .data-text {
            font-size: 2.8rem;
            font-family: antiquarian-scribe, sans-serif;
            font-weight: 800;
            margin: 0px 0 15px 0;
            color: var(--col-5);
            letter-spacing: -1px;
        }

        .label {
            font-size: 0.8rem;
            color: var(--col-4);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        #status {
            font-size: 0.85rem;
            color: #d9534f;
            margin-top: 15px;
            font-weight: 600;
        }

        .btn-back {
            margin-top: 20px;
            padding: 10px 20px;
            background: var(--col-4);
            color: var(--col-1);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-family: antiquarian, sans-serif;
            font-size: 1rem;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <!-- 3D BAKGRUND (Topografiska linjer) -->
    <div class="map-background">
        <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
            <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
                <path d="M 100 0 L 0 0 0 100" fill="none" stroke="var(--col-2)" stroke-width="1"/>
            </pattern>
            <rect width="100%" height="100%" fill="url(#grid)" />
            
            <g fill="none" stroke="var(--col-4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M-100,200 C150,150 250,300 500,250 C700,210 800,400 1100,350" />
                <path d="M-100,300 C200,250 300,400 550,350 C750,310 850,500 1100,450" />
                <path d="M100,100 C300,50 400,200 650,150 C850,110 950,300 1200,250" opacity="0.5"/>
                <path d="M-50,600 C200,500 400,700 700,550 C900,450 950,700 1100,600" />
                <path d="M-50,700 C250,600 450,800 750,650 C950,550 1000,800 1100,700" />
                <path d="M700,800 C650,820 620,870 650,920 C680,970 750,950 780,900 C810,850 750,780 700,800 Z" />
                <path d="M710,830 C680,840 660,870 680,900 C700,930 740,920 750,890 C760,860 740,820 710,830 Z" opacity="0.6"/>
                <path d="M705,860 L725,880 M725,860 L705,880" stroke="var(--col-5)" stroke-width="4" />
            </g>
        </svg>
    </div>

    <!-- STARTSKÄRM -->
    <div id="start-screen" class="screen active">
        <div class="header-container">
            <h1>Midsommarjakten <span class="num">2026</span></h1>
            <div class="subtitle">Välj ditt lag</div>
        </div>

        <div class="team-grid">
            <button class="team-btn" onclick="selectTeam('Lag Röd')">
                <span class="team-name">Lag Röd</span>
                <span class="team-members">Anna, Björn, Cecilia, David</span>
            </button>

            <button class="team-btn" onclick="selectTeam('Lag Blå')">
                <span class="team-name">Lag Blå</span>
                <span class="team-members">Erik, Frida, Gustav, Hanna</span>
            </button>

            <button class="team-btn" onclick="selectTeam('Lag Grön')">
                <span class="team-name">Lag Grön</span>
                <span class="team-members">Ida, Johan, Karin, Lars</span>
            </button>

            <button class="team-btn" onclick="selectTeam('Lag Gul')">
                <span class="team-name">Lag Gul</span>
                <span class="team-members">Maria, Niklas, Olof, Petra</span>
            </button>
        </div>
    </div>

    <!-- SPELSKÄRM (Kompass) -->
    <div id="app-screen" class="screen">
        <div class="header-container">
            <h1 id="active-team-display">Inget lag valt</h1>
            <div class="subtitle">Etapp <span class="num">1</span></div>
        </div>

        <div class="label">Avstånd till mål</div>
        <div id="distance" class="data-text">-- m</div>
        
        <div id="compass-container">
            <svg id="arrow" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" fill="none" stroke="var(--col-2)" stroke-width="2"/>
                <circle cx="50" cy="50" r="42" fill="none" stroke="var(--col-3)" stroke-width="1" stroke-dasharray="4 4"/>
                <polygon points="50,12 58,50 50,50" fill="var(--col-5)" />
                <polygon points="50,12 42,50 50,50" fill="var(--col-4)" />
                <polygon points="50,88 58,50 50,50" fill="var(--col-3)" />
                <polygon points="50,88 42,50 50,50" fill="var(--col-2)" />
                <circle cx="50" cy="50" r="4" fill="var(--col-1)" stroke="var(--col-5)" stroke-width="2"/>
            </svg>
        </div>

        <div class="label">Riktning</div>
        <div id="heading" class="data-text">--°</div>
        
        <div id="status"></div>
        <button class="btn-back" onclick="goBack()">Avbryt</button>
    </div>

    <script>
        // --- DATASTRUKTUR FÖR LAGENS MÅL (ETAPP 1) ---
        // Byt ut dessa koordinater för att testa på din plats
        const teamCoordinates = {
            'Lag Röd':  { lat: 59.3293, lng: 18.0686 }, // Exempel: Stockholm
            'Lag Blå':  { lat: 59.3300, lng: 18.0700 }, // Exempel: Något annat
            'Lag Grön': { lat: 59.3280, lng: 18.0650 }, 
            'Lag Gul':  { lat: 59.3310, lng: 18.0670 }  
        };

        // --- DOM Element ---
        const startScreen = document.getElementById('start-screen');
        const appScreen = document.getElementById('app-screen');
        const activeTeamDisplay = document.getElementById('active-team-display');
        const distanceEl = document.getElementById('distance');
        const arrowEl = document.getElementById('arrow');
        const headingEl = document.getElementById('heading');
        const statusEl = document.getElementById('status');

        // --- SENSOR VARIABLER ---
        let currentTargetLat = null;
        let currentTargetLng = null;
        
        let currentLat = null;
        let currentLng = null;
        let currentHeading = 0;
        let bearingToTarget = 0;
        
        let targetVisualRotation = 0;
        let currentVisualRotation = 0;
        
        let watchId = null;
        let isTracking = false;
        let animationFrameId = null;

        // --- MATEMATIK ---
        function toRad(deg) { return deg * Math.PI / 180; }
        function toDeg(rad) { return rad * 180 / Math.PI; }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        function calculateBearing(lat1, lng1, lat2, lng2) {
            const dLon = toRad(lng2 - lng1);
            const y = Math.sin(dLon) * Math.cos(toRad(lat2));
            const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                      Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
            let brng = toDeg(Math.atan2(y, x));
            return (brng + 360) % 360;
        }

        // --- UPPDATERA LOGIK ---
        function updateLogic() {
            if (currentLat === null || currentLng === null || currentTargetLat === null) return;

            const dist = calculateDistance(currentLat, currentLng, currentTargetLat, currentTargetLng);
            bearingToTarget = calculateBearing(currentLat, currentLng, currentTargetLat, currentTargetLng);

            if (dist <= 5) {
                distanceEl.innerText = "MÅL NÅTT!";
                distanceEl.style.color = "var(--col-5)";
            } else {
                distanceEl.innerHTML = `<span class="num">${dist}</span> m`;
                distanceEl.style.color = "var(--col-5)";
            }
            headingEl.innerHTML = `<span class="num">${Math.round(currentHeading)}</span>°`;

            let rawTarget = bearingToTarget - currentHeading;
            let diff = rawTarget - targetVisualRotation;
            diff = ((diff + 540) % 360) - 180;
            targetVisualRotation += diff;
        }

        // --- RENDER LOOP ---
        function renderFrame() {
            const smoothingFactor = 0.2; 
            currentVisualRotation += (targetVisualRotation - currentVisualRotation) * smoothingFactor;
            arrowEl.style.transform = `rotate(${currentVisualRotation}deg)`;
            
            if(isTracking) {
                animationFrameId = requestAnimationFrame(renderFrame);
            }
        }

        // --- SENSOR HANDLER ---
        function handleOrientation(event) {
            if (event.webkitCompassHeading) {
                currentHeading = event.webkitCompassHeading;
            } else if (event.alpha !== null) {
                currentHeading = 360 - event.alpha;
            }
            updateLogic();
        }

        // --- STARTA LAG & SENSORER ---
        async function selectTeam(teamName) {
            statusEl.innerText = "";
            
            // 1. Sätt målet för laget
            currentTargetLat = teamCoordinates[teamName].lat;
            currentTargetLng = teamCoordinates[teamName].lng;
            activeTeamDisplay.innerText = teamName;
            
            // 2. Fråga om kompass-behörighet (Måste anropas av click-event)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        statusEl.innerText = "Kompass nekad. Godkänn i inställningar.";
                        return;
                    }
                } catch (error) {
                    statusEl.innerText = "Kunde inte begära rättigheter.";
                    return;
                }
            }

            // Byt vy
            startScreen.classList.remove('active');
            appScreen.classList.add('active');

            // 3. Starta spårning
            isTracking = true;
            animationFrameId = requestAnimationFrame(renderFrame);

            if (navigator.geolocation) {
                distanceEl.innerText = "Söker GPS...";
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLng = position.coords.longitude;
                        updateLogic();
                    },
                    (error) => {
                        distanceEl.innerText = "GPS Fel";
                        console.error(error);
                    },
                    { enableHighAccuracy: true, maximumAge: 0 }
                );
            } else {
                distanceEl.innerText = "GPS ej stödd";
            }

            window.addEventListener('deviceorientation', handleOrientation);
        }

        // --- AVSLUTA/GÅ TILLBAKA ---
        function goBack() {
            // Stoppa sensorer
            isTracking = false;
            cancelAnimationFrame(animationFrameId);
            window.removeEventListener('deviceorientation', handleOrientation);
            if(watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            
            // Återställ vy
            distanceEl.innerText = "-- m";
            headingEl.innerText = "--°";
            currentLat = null;
            currentLng = null;
            
            appScreen.classList.remove('active');
            startScreen.classList.add('active');
        }

        // --- PWA Service Worker ---
        const swCode = `
            const CACHE_NAME = 'skattjakt-cache-v7';
            self.addEventListener('install', event => {
                event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll([location.href])));
            });
            self.addEventListener('fetch', event => {
                event.respondWith(
                    fetch(event.request).then(response => {
                        return caches.open(CACHE_NAME).then(cache => {
                            cache.put(event.request, response.clone());
                            return response;
                        });
                    }).catch(() => caches.match(event.request))
                );
            });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
        }
    </script>
</body>
</html>
